  <!-- Web Audio ESP32 Buzzer Sound Synthesizer -->
  <script>
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        [0.0, 0.16, 0.32, 0.48].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2600, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.35, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio blocked:", e);
      }
    };

    window.playGentleTap = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } catch(e) {}
    };
  </script>

    // ==========================================
    // 2. CANVAS RADAR RING (MINIMAL APPLE GREEN)
    // ==========================================
    function ParticleRadarRing() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const size = Math.min(window.innerWidth * 0.85, 330);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        const baseRadius = size * 0.38;

        const particleCount = 100;
        const particles = Array.from({ length: particleCount }).map(() => ({
          angle: Math.random() * Math.PI * 2,
          radiusOffset: (Math.random() - 0.5) * 40,
          speed: 0.005 + Math.random() * 0.010,
          baseSize: 1.6 + Math.random() * 2.4,
          alpha: 0.2 + Math.random() * 0.75,
          pulseSpeed: 0.02 + Math.random() * 0.03
        }));

        const render = () => {
          ctx.clearRect(0, 0, size, size);

          // Subtle minimal glass rings
          [0.38, 0.7, 1.0].forEach((scale, i) => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseRadius * scale, 0, Math.PI * 2);
            ctx.strokeStyle = i === 2 ? 'rgba(52, 199, 89, 0.35)' : 'rgba(255, 255, 255, 0.12)';
            ctx.lineWidth = 1;
            ctx.stroke();
          });

          // Soft particles
          particles.forEach(p => {
            p.angle += p.speed;
            p.alpha += Math.sin(Date.now() * 0.003 * p.pulseSpeed) * 0.015;
            const currentAlpha = Math.max(0.15, Math.min(0.85, p.alpha));

            const currentR = baseRadius + p.radiusOffset + Math.sin(p.angle * 3) * 5;
            const x = centerX + Math.cos(p.angle) * currentR;
            const y = centerY + Math.sin(p.angle) * currentR;

            ctx.beginPath();
            ctx.arc(x, y, p.baseSize, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(52, 199, 89, ${currentAlpha})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = "#34c759";
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      return (
        <div className="relative flex items-center justify-center">
          <canvas ref={canvasRef} className="block select-none pointer-events-none" />
        </div>
      );
    }

      const [renameInput, setRenameInput] = useState("");

      // Settings Feedback Form
      const [feedbackRating, setFeedbackRating] = useState(5);
      const [feedbackCategory, setFeedbackCategory] = useState("General UI");
      const [feedbackComment, setFeedbackComment] = useState("");
      const [feedbackSent, setFeedbackSent] = useState(false);

      // Settings Preferences
      const [hapticEnabled, setHapticEnabled] = useState(true);
      const [distanceUnit, setDistanceUnit] = useState("ft");

      // Gentle Liquid Touches (Soft diffusion droplet)
      const [gentleTouches, setGentleTouches] = useState([]);

      // Toast Notification
      const [toastMsg, setToastMsg] = useState(null);

      // Dock Active Option (Index: 0=Add, 1=Rename, 2=Settings)
      const [activeDockTab, setActiveDockTab] = useState(0);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Gentle Touch Interaction
      const handleGlobalClick = (e) => {
        const x = e.clientX;
        const y = e.clientY;
        const id = Date.now() + Math.random();
        setGentleTouches(prev => [...prev.slice(-3), { id, x, y }]);
        setTimeout(() => {
          setGentleTouches(prev => prev.filter(t => t.id !== id));
        }, 850);
      };

      const currentDevice = useMemo(() => {
        return devices.find(d => d.id === activeDeviceId) || devices[0] || null;
      }, [devices, activeDeviceId]);

      // Sound ESP32 Buzzer
      const handleTriggerBuzzer = () => {
        window.playGentleTap();
        setIsBuzzerSounding(true);
        window.triggerESP32BuzzerAlarm();
        notify(`Buzzer Sounding on ${currentDevice?.name || "TrackoVex"}!`);
        setTimeout(() => setIsBuzzerSounding(false), 2200);
      };

      // Live Tracking Interval
      useEffect(() => {
        if (!currentDevice) return;
        const interval = setInterval(() => {
          if (searchState === "found") {
            setDistanceVal(prev => {
              const delta = (Math.random() * 2 - 1);
              return Math.max(1, Math.round(prev + delta));
            });
            setArrowAngle(prev => (prev + (Math.random() * 10 - 5)));
          }
        }, 1600);
        return () => clearInterval(interval);
      }, [currentDevice, searchState]);

      // Start BLE Scan
      const startBLEScan = async () => {
        window.playGentleTap();
        setIsScanningBLE(true);
        setBleStatus("scanning");

        if (navigator.bluetooth) {
          try {
            const dev = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: ['battery_service']
            });
            if (dev) {
              setDiscoveredESP({
                id: dev.id || `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
                rawName: dev.name || `ESP32_TrackoVex_${devices.length + 1}`,
                rssi: "-48 dBm",
                battery: 98
              });
              setBleStatus("discovered");
              return;
            }
          } catch (e) {}
        }

        setTimeout(() => {
          const count = devices.length + 1;
          setDiscoveredESP({
            id: `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
            rawName: `ESP32_TrackoVex_Unit_${count}`,
            rssi: "-48 dBm",
            battery: count === 1 ? 94 : 85
          });
          setBleStatus("discovered");
        }, 1600);
      };

      const confirmPairDevice = () => {
        window.playGentleTap();
        if (!discoveredESP) return;
        const defaultNames = ["Camera", "Car Keys", "MacBook Sleeve", "Backpack"];
        const nameToUse = defaultNames[devices.length % defaultNames.length];
        
        const newDevice = {
          id: discoveredESP.id,
          name: nameToUse,
          battery: discoveredESP.battery || 100,
          rawName: discoveredESP.rawName,
          rssi: discoveredESP.rssi
        };

        const updated = [...devices, newDevice];
        setDevices(updated);
        setActiveDeviceId(newDevice.id);
        setSearchState("searching");
        setIsScanningBLE(false);
        setDiscoveredESP(null);
        setBleStatus("idle");
        notify(`Paired "${newDevice.name}" successfully!`);

        setTimeout(() => {
          setSearchState("found");
          setDistanceVal(Math.floor(4 + Math.random() * 7));
          notify(`Signal locked on ${newDevice.name}!`);
        }, 2500);
      };

      const openRename = (dev) => {
        window.playGentleTap();
        if (!dev) {
          notify("No active device to rename!");
          return;
        }
        setRenameInput(dev.name);
        setIsRenaming(true);
      };

      const saveRename = () => {
        window.playGentleTap();
        if (!renameInput.trim() || !currentDevice) return;
        const clean = renameInput.trim();
        setDevices(prev => prev.map(d => d.id === currentDevice.id ? { ...d, name: clean } : d));
        setIsRenaming(false);
        notify(`Renamed to "${clean}"`);
      };

      const handleUnpair = () => {
        window.playGentleTap();
        if (!currentDevice) return;
        const remaining = devices.filter(d => d.id !== currentDevice.id);
        setDevices(remaining);
        setActiveDeviceId(remaining[0]?.id || null);
        notify(`Removed "${currentDevice.name}"`);
      };

      const handleFeedbackSubmit = (e) => {
        e.preventDefault();
        window.playGentleTap();
        setFeedbackSent(true);
        notify("Thank you! Feedback received.");
        setTimeout(() => {
          setFeedbackComment("");
          setFeedbackSent(false);
        }, 2800);
      };

      // Fallback ambient fluid canvas if background video fails
      useEffect(() => {
        const canvas = document.getElementById('fallback-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let step = 0;
        let id;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          step += 0.005;
          const grad = ctx.createRadialGradient(
            canvas.width * 0.5 + Math.sin(step) * 120,
            canvas.height * 0.35 + Math.cos(step * 0.8) * 80,
            40,
            canvas.width * 0.5,
            canvas.height * 0.5,
            canvas.width * 0.7
          );
          grad.addColorStop(0, 'rgba(52, 199, 89, 0.25)');
          grad.addColorStop(0.5, 'rgba(16, 75, 36, 0.18)');
          grad.addColorStop(1, 'rgba(3, 13, 6, 0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          id = requestAnimationFrame(draw);
        };
        draw();
        return () => cancelAnimationFrame(id);
      }, []);

      // Check whether dock should be shown:
      // USER RULE: "it only present at the homepage not at the pairing, tracking and other pages rather than the homepage"
      const isDockVisible = currentView === 'home' && !isScanningBLE && !showSettingsModal && !isRenaming && !showDeviceDrawer && !showIntro;

      return (
        <div 
          onClick={handleGlobalClick}
          className="relative w-screen h-screen flex flex-col overflow-hidden select-none font-sans"
        >
          {/* GENTLE LIQUID TOUCH ANIMATIONS */}
          {gentleTouches.map(t => (
            <div 
              key={t.id} 
              className="gentle-liquid-touch animate-gentle-bloom" 
              style={{ top: t.y, left: t.x }}
            />
          ))}

          {/* Intro Splash Screen */}
          {showIntro && (
            <IntroSplash onContinue={() => setShowIntro(false)} />
          )}

          {/* Minimal Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 inset-x-6 z-50 flex items-center justify-center pointer-events-none">
              <div className="px-5 py-2.5 rounded-full apple-glass-btn text-[#34c759] text-xs font-semibold flex items-center gap-2 shadow-xl border border-white/30">
                <span className="w-2 h-2 rounded-full bg-[#34c759]"></span>
                <span className="text-white">{toastMsg}</span>
              </div>
            </div>
          )}

          {/* ========================================================
              TOP HEADER BAR (UNTOUCHED ORIGINAL INTERFACE)
              ======================================================== */}
          <div className="w-full pt-12 px-6 pb-3 flex items-start justify-between z-20">
            <div className="flex items-center gap-3">
              <div className="flex flex-col">
                <div className="text-[10px] font-extrabold uppercase tracking-widest text-[#34c759] font-sans">
                  {currentDevice ? (searchState === "searching" ? "FINDING" : "NEARBY") : "TRACKOVEX"}
                </div>

                <div className="flex items-center gap-1.5 mt-0.5">
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white font-sans truncate max-w-[180px] sm:max-w-xs">
                    {currentDevice ? currentDevice.name : "No Beacon Paired"}
                  </h1>
                </div>

                {currentDevice && (
                  <div className="flex items-center gap-1.5 mt-1">
                    <div className="relative flex items-center">
                      <div className="w-5 h-2.5 rounded-[3px] border border-[#34c759] p-[1px] flex items-center">
                        <div 
                          className={`h-full rounded-[1px] transition-all duration-500 ${
                            currentDevice.battery > 20 ? 'bg-[#34c759]' : 'bg-[#ff453a]'
                          }`}
                          style={{ width: `${currentDevice.battery}%` }}
                        ></div>
                      </div>
                      <div className="w-[2px] h-[4px] bg-[#34c759] rounded-r-[1px] ml-[1px]"></div>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-300 font-mono">
                      {currentDevice.battery}%
                    </span>
                    <span className="text-[9px] text-emerald-300/70 ml-1">• ESP32 UWB</span>
                  </div>
                )}
              </div>
            </div>

            {/* UPPER RADAR / ARROW TOGGLE */}
            <div className="flex items-center gap-2 pt-1">
              {currentDevice && (
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    window.playGentleTap();
                    setSearchState(prev => prev === 'searching' ? 'found' : 'searching'); 
                  }}
                  className="px-3.5 py-2 rounded-full apple-glass-btn text-[11px] font-semibold text-emerald-200 border border-white/20"
                >
                  {searchState === 'searching' ? "View Arrow" : "View Radar"}
                </button>
              )}

              {/* Multi-Device Badge */}
              {devices.length > 1 && (
                <button 
                  onClick={(e) => { e.stopPropagation(); setShowDeviceDrawer(true); }}
                  className="px-3 py-1.5 rounded-full apple-glass-btn text-[11px] font-bold text-[#34c759] flex items-center gap-1"
                >
                  <Icon name="layers" size={13} />
                  <span>{devices.length}</span>
                </button>
              )}
            </div>
          </div>

          {/* ========================================================
              CENTER CANVAS: RADAR & DIRECTION ARROW OR BLUETOOTH ORB
              ======================================================== */}
          <div className="flex-1 w-full flex flex-col items-center justify-center relative px-6 z-10">
            {!currentDevice && (
              <div className="flex flex-col items-center justify-center text-center p-8">
                {/* Minimal Liquid Glass Bluetooth Logo Orb */}
                <div className="w-24 h-24 rounded-full apple-bluetooth-orb flex items-center justify-center mb-6 shadow-2xl">
                  <Icon name="bluetooth" size={38} className="text-[#34c759]" />
                </div>
                <h2 className="text-xl font-extrabold text-white">No TrackoVex AirTag Found</h2>
                <p className="text-xs text-emerald-200/80 max-w-xs mt-2 leading-relaxed">
                  Power ON your Bluetooth beacon and tap the plus key on the dock to pair.
                </p>
              </div>
            )}

            {currentDevice && (
              <div className="w-full flex flex-col items-center justify-center">
                {searchState === "searching" ? (
                  <div className="flex flex-col items-center justify-center">
                    <ParticleRadarRing />
                  </div>
                ) : (
                  <div className="flex flex-col items-center justify-center">
                    <DirectionArrowView angle={arrowAngle} />
                  </div>
                )}
              </div>
            )}
          </div>

          {/* ========================================================
              BOTTOM DISTANCE & ACTIONS READOUT (UNTOUCHED LAYOUT)
              ======================================================== */}
          {currentDevice && (
            <div className="w-full px-8 pb-32 pt-2 z-20 flex flex-col justify-end">
              <div className="mb-2 select-none">
                <div className="flex items-baseline gap-2">
                  <span className="text-6xl sm:text-7xl font-extrabold tracking-tight text-white font-sans">
                    {searchState === "searching" ? "11" : distanceVal}
                  </span>
                  <span className="text-4xl sm:text-5xl font-light text-emerald-300 font-sans">
                    {distanceUnit}
                  </span>
                </div>

                {searchState === "found" && (
                  <div className="text-2xl sm:text-3xl font-normal text-emerald-200/90 tracking-tight mt-0.5 font-sans">
                    to your <span className="text-[#34c759] font-bold">{directionLabel.replace("to your ", "")}</span>
                  </div>
                )}
              </div>

              {/* Disconnect & Buzzer triggers */}
              <div className="flex items-center justify-between mt-2">
                <button 
                  onClick={handleUnpair}
                  className="w-12 h-12 rounded-full apple-glass-circle flex items-center justify-center text-white/80 hover:text-rose-400"
                  title="Disconnect Device"
                >
                  <Icon name="x" size={20} className="stroke-[2.5]" />
                </button>

                <button 
                  onClick={handleTriggerBuzzer}
                  className={`w-12 h-12 rounded-full apple-glass-circle flex items-center justify-center transition-all ${
                    isBuzzerSounding ? 'apple-buzzer-active animate-buzzer-gentle text-rose-300' : 'text-[#34c759]'
                  }`}
                  title="Alert TrackoVex Buzzer (ESP32)"
                >
                  <Icon 
                    name={isBuzzerSounding ? "bell-ring" : "volume-2"} 
                    size={20} 
                    className={`stroke-[2.2] ${isBuzzerSounding ? 'text-rose-300' : ''}`} 
                  />
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              AUTHENTIC APPLE LIQUID GLASS DOCK (AS IN ATTACHED IMAGE)
              RULE: STRICTLY RENDERED ONLY ON HOMEPAGE!
              NOT AT PAIRING, TRACKING, OR SETTINGS!
              Features smooth sliding glass indicator!
              ======================================================== */}
          {isDockVisible && (
            <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none transition-all duration-300">
              <div className="pointer-events-auto px-2 py-2 apple-glass-dock flex items-center shadow-2xl relative w-full max-w-[320px]">
                
                {/* Minimal Sliding Liquid Pill Highlight across options */}
                <div 
                  className="absolute top-2 bottom-2 rounded-full transition-all duration-300 ease-[cubic-bezier(0.2,0.8,0.2,1)] pointer-events-none"
                  style={{
                    left: `calc(${activeDockTab * 33.33}% + 6px)`,
                    width: `calc(33.33% - 12px)`,
                    background: 'rgba(255, 255, 255, 0.18)',
                    border: '1px solid rgba(255, 255, 255, 0.4)',
                    boxShadow: 'inset 0 1px 1.5px rgba(255, 255, 255, 0.65), 0 4px 12px rgba(0, 0, 0, 0.25)',
                    backdropFilter: 'blur(10px)'
                  }}
                />

                {/* 1. ADD / PAIR BUTTON */}
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    setActiveDockTab(0);
                    startBLEScan(); 
                  }}
                  className="flex-1 flex flex-col items-center py-2 relative z-10 transition-transform active:scale-95 group"
                >
                  <Icon name="plus" size={19} className="stroke-[2.2] text-white/90 group-hover:text-[#34c759]" />
                  <span className="text-[10px] font-semibold text-emerald-100/90 mt-0.5">Add</span>
                </button>

                {/* 2. RENAME BUTTON */}
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    setActiveDockTab(1);
                    openRename(currentDevice); 
                  }}
                  className="flex-1 flex flex-col items-center py-2 relative z-10 transition-transform active:scale-95 group"
                >
                  <Icon name="edit-3" size={18} className="stroke-[2.2] text-white/90 group-hover:text-[#34c759]" />
                  <span className="text-[10px] font-semibold text-emerald-100/90 mt-0.5">Rename</span>
                </button>

                {/* 3. SETTINGS BUTTON */}
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    setActiveDockTab(2);
                    setShowSettingsModal(true); 
                  }}
                  className="flex-1 flex flex-col items-center py-2 relative z-10 transition-transform active:scale-95 group"
                >
                  <Icon name="settings" size={18} className="stroke-[2.2] text-white/90 group-hover:text-[#34c759]" />
                  <span className="text-[10px] font-semibold text-emerald-100/90 mt-0.5">Settings</span>
                </button>

              </div>
            </div>
          )}

          {/* ========================================================
              SETTINGS MODAL (FULL LIQUID GLASS - NO DOCK PRESENT)
              Customer Feedback, Support Mail, Editable HTML Fields
              ======================================================== */}
          {showSettingsModal && (
            <div 
              onClick={(e) => { e.stopPropagation(); setShowSettingsModal(false); }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-6 shadow-2xl space-y-5 border border-white/30 max-h-[85vh] overflow-y-auto"
              >
                {/* Title Bar */}
                <div className="flex items-center justify-between pb-2 border-b border-white/15">
                  <h2 className="text-xl font-extrabold text-white tracking-tight">Settings</h2>
                  <button 
                    onClick={() => setShowSettingsModal(false)}
                    className="w-8 h-8 rounded-full apple-glass-btn text-white/80 flex items-center justify-center hover:text-white"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {/* FEATURE 1: CUSTOMER FEEDBACK (Editable in HTML) */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                    <Icon name="message-square" size={13} />
                    <span>Customer Feedback</span>
                  </div>
                  <div className="apple-settings-card p-4 space-y-3">
                    <div className="text-xs text-emerald-100/80">
                      Share your experience or report bugs with the beacon hardware:
                    </div>

                    <form onSubmit={handleFeedbackSubmit} className="space-y-3">
                      {/* Star Rating */}
                      <div className="flex items-center gap-2">
                        {[1, 2, 3, 4, 5].map((star) => (
                          <button
                            type="button"
                            key={star}
                            onClick={() => {
                              window.playGentleTap();
                              setFeedbackRating(star);
                            }}
                            className="p-1 transition-transform active:scale-90"
                          >
                            <Icon 
                              name="star" 
                              size={18} 
                              className={star <= feedbackRating ? "text-[#34c759] fill-[#34c759]" : "text-white/20"} 
                            />
                          </button>
                        ))}
                        <span className="text-xs text-emerald-200/80 ml-2 font-mono">{feedbackRating} / 5 Stars</span>
                      </div>

                      {/* Category */}
                      <div>
                        <select 
                          value={feedbackCategory}
                          onChange={(e) => setFeedbackCategory(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl apple-glass-input text-xs"
                        >
                          <option value="General UI" className="bg-[#040d07] text-white">General UI & Liquid Glass</option>
                          <option value="ESP32 Buzzer" className="bg-[#040d07] text-white">ESP32 Buzzer Feedback</option>
                          <option value="Tracking" className="bg-[#040d07] text-white">Direction / Distance Radar</option>
                          <option value="Feature" className="bg-[#040d07] text-white">Feature Request</option>
                        </select>
                      </div>

                      {/* Comment */}
                      <div>
                        <textarea 
                          rows="2"
                          value={feedbackComment}
                          onChange={(e) => setFeedbackComment(e.target.value)}
                          placeholder="Your comments..."
                          required
                          className="w-full p-2.5 rounded-xl apple-glass-input text-xs resize-none"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-2.5 rounded-xl apple-primary-glass-btn text-white text-xs font-bold"
                      >
                        {feedbackSent ? "✓ Feedback Submitted" : "Send Customer Feedback"}
                      </button>
                    </form>
                  </div>
                </div>

                {/* FEATURE 2: SUPPORT EMAIL & HELPLINE */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                    <Icon name="mail" size={13} />
                    <span>Support & Contact</span>
                  </div>
                  <div className="apple-settings-card divide-y divide-white/10">
                    <div className="p-3.5 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-semibold text-white">Official Support Email</div>
                        <div className="text-[11px] font-mono text-emerald-300">{APP_CONFIG.supportEmail}</div>
                      </div>
                      <a 
                        href={`mailto:${APP_CONFIG.supportEmail}?subject=TrackoVex%20Support`}
                        className="px-3 py-1.5 rounded-full apple-glass-btn text-xs font-bold text-[#34c759]"
                      >
                        Email
                      </a>
                    </div>

                    <div className="p-3.5 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-semibold text-white">Helpline Phone</div>
                        <div className="text-[11px] font-mono text-emerald-300">{APP_CONFIG.supportPhone}</div>
                      </div>
                      <button 
                        onClick={() => {
                          navigator.clipboard?.writeText(APP_CONFIG.supportPhone);
                          notify("Phone copied!");
                        }}
                        className="px-3 py-1.5 rounded-full apple-glass-btn text-xs font-semibold text-white"
                      >
                        Copy
                      </button>
                    </div>
                  </div>
                </div>

                {/* FEATURE 3: PREFERENCES & SYSTEM INFO */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                    <Icon name="sliders" size={13} />
                    <span>System & Preferences</span>
                  </div>
                  <div className="apple-settings-card divide-y divide-white/10">
                    {/* Unit Switch */}
                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold text-white">Distance Unit</span>
                      <div className="flex gap-1">
                        <button 
                          onClick={() => setDistanceUnit('ft')}
                          className={`px-3 py-1 rounded-full text-xs font-bold transition-all ${
                            distanceUnit === 'ft' ? 'bg-[#34c759] text-white shadow' : 'text-emerald-300/80'
                          }`}
                        >
                          Feet (ft)
                        </button>
                        <button 
                          onClick={() => setDistanceUnit('m')}
                          className={`px-3 py-1 rounded-full text-xs font-bold transition-all ${
                            distanceUnit === 'm' ? 'bg-[#34c759] text-white shadow' : 'text-emerald-300/80'
                          }`}
                        >
                          Meters (m)
                        </button>
                      </div>
                    </div>

                    {/* Version */}
                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold text-white">Version</span>
                      <span className="text-xs font-mono font-bold text-[#34c759]">{APP_CONFIG.version}</span>
                    </div>

                    {/* Hardware Protocol */}
                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold text-white">Hardware Protocol</span>
                      <span className="text-xs font-mono text-emerald-200">{APP_CONFIG.hardwareProtocol}</span>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => setShowSettingsModal(false)}
                  className="w-full py-3.5 rounded-2xl apple-glass-btn text-white text-xs font-bold shadow-lg transition-all mt-2"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: ESP32 BLUETOOTH PAIRING (NO DOCK PRESENT)
              ======================================================== */}
          {isScanningBLE && (
            <div 
              onClick={(e) => { e.stopPropagation(); setIsScanningBLE(false); }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-sm rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-7 shadow-2xl space-y-5 border border-white/30"
              >
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="bluetooth" size={20} className="text-[#34c759]" />
                    <h3 className="text-lg font-bold text-white">Pair TrackoVex BLE</h3>
                  </div>
                  <button onClick={() => setIsScanningBLE(false)} className="p-1 text-emerald-300 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {bleStatus === "scanning" && (
                  <div className="py-8 flex flex-col items-center text-center">
                    <div className="w-16 h-16 rounded-full apple-bluetooth-orb text-[#34c759] flex items-center justify-center mb-4">
                      <Icon name="radio" size={28} className="animate-pulse" />
                    </div>
                    <p className="text-sm font-bold text-white">Listening for Bluetooth Signals...</p>
                    <p className="text-xs text-emerald-200/80 mt-1">Ensure your TrackoVex beacon is nearby</p>
                  </div>
                )}

                {bleStatus === "discovered" && discoveredESP && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl apple-settings-card flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl apple-bluetooth-orb flex items-center justify-center text-[#34c759]">
                          <Icon name="cpu" size={20} />
                        </div>
                        <div>
                          <div className="text-sm font-bold text-white">{discoveredESP.rawName}</div>
                          <div className="text-[11px] text-emerald-300 font-mono">Battery: {discoveredESP.battery}%</div>
                        </div>
                      </div>
                      <span className="text-xs font-mono font-bold text-[#34c759]">{discoveredESP.rssi}</span>
                    </div>

                    <button 
                      onClick={confirmPairDevice}
                      className="w-full py-3.5 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-xl active:scale-95 transition-all"
                    >
                      Connect & Begin Tracking
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: RENAME DEVICE
              ======================================================== */}
          {isRenaming && (
            <div 
              onClick={(e) => { e.stopPropagation(); setIsRenaming(false); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-sm rounded-[32px] apple-glass-panel p-7 shadow-2xl space-y-4 border border-white/30"
              >
                <div className="text-center">
                  <h3 className="text-xl font-extrabold text-white">Rename TrackoVex</h3>
                  <p className="text-xs text-emerald-200/80 mt-1">Customize beacon label</p>
                </div>

                <div>
                  <input 
                    type="text"
                    value={renameInput}
                    onChange={(e) => setRenameInput(e.target.value)}
                    placeholder="e.g. Camera, Keys, Wallet"
                    autoFocus
                    className="w-full px-4 py-3.5 rounded-2xl apple-glass-input text-white text-base font-semibold focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => setIsRenaming(false)}
                    className="py-3 rounded-2xl apple-glass-btn text-white text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveRename}
                    className="py-3 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-lg"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              DRAWER: MULTI-DEVICE SWITCHER
              ======================================================== */}
          {showDeviceDrawer && (
            <div 
              onClick={(e) => { e.stopPropagation(); setShowDeviceDrawer(false); }}
              className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-6 shadow-2xl space-y-4 border border-white/30"
              >
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h3 className="text-lg font-bold text-white">Active TrackoVex Devices</h3>
                    <p className="text-xs text-emerald-300/70">Switch focus between connected beacons</p>
                  </div>
                  <button onClick={() => setShowDeviceDrawer(false)} className="p-1 text-emerald-300 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {devices.map(dev => {
                    const isActive = dev.id === currentDevice?.id;
                    return (
                      <div 
                        key={dev.id}
                        onClick={() => {
                          setActiveDeviceId(dev.id);
                          setShowDeviceDrawer(false);
                          notify(`Switched to ${dev.name}`);
                        }}
                        className={`p-3.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all border ${
                          isActive 
                            ? 'bg-white/20 border-[#34c759]' 
                            : 'bg-white/5 border-white/10 hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${
                            isActive ? 'bg-[#34c759] text-white' : 'bg-white/10 text-white/80'
                          }`}>
                            <Icon name="radio" size={16} />
                          </div>
                          <div>
                            <div className="text-sm font-bold text-white flex items-center gap-2">
                              <span>{dev.name}</span>
                              {isActive && <span className="w-1.5 h-1.5 rounded-full bg-[#34c759]"></span>}
                            </div>
                            <div className="text-[11px] text-emerald-300/80 font-mono">Battery: {dev.battery}%</div>
                          </div>
                        </div>

                        <span className={`text-xs font-semibold ${isActive ? 'text-[#34c759]' : 'text-neutral-400'}`}>
                          {isActive ? "Active" : "Select"}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <button 
                  onClick={() => {
                    setShowDeviceDrawer(false);
                    startBLEScan();
                  }}
                  className="w-full py-3.5 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="plus" size={16} />
                  <span>Pair Another TrackoVex</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
