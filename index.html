  <style>
    /* ========================================================
       GLOBAL & 60 FPS LIQUID MORPHISM STYLES
       ======================================================== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

    html, body {

    /* Ambient Liquid Background Animation */

    /* ========================================================
       PREMIUM LIQUID GLASS MORPHISM SYSTEM
       ======================================================== */

      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(0, 255, 102, 0.08) 45%, rgba(0, 25, 10, 0.42) 100%);

      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(0, 255, 102, 0.06) 50%, rgba(2, 28, 12, 0.4) 100%);

    /* Specular Highlights for Liquid Glass */
    .specular-gloss::before {
      content: '';

    /* Liquid Glass Continue & Action Button */

    /* Secondary Liquid Glass Button */

    /* Circle Action Buttons (Buzzer, Cancel, Radar Toggle) */
    .liquid-circle-btn {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(0, 255, 102, 0.12) 100%);

    .liquid-circle-buzzer-active {

    /* Liquid Glass Floating Dock */

    /* Center Bluetooth Liquid Sphere */
    .liquid-bluetooth-sphere {

    /* Liquid Glass Sliding Active Pill in Dock */
    .liquid-dock-pill {
      background: linear-gradient(135deg, rgba(0, 255, 102, 0.35) 0%, rgba(255, 255, 255, 0.25) 100%);
      border: 1px solid rgba(0, 255, 102, 0.6);

    /* Water Ripple Canvas */
    #water-ripple-canvas {
      position: fixed;

    /* Smooth 60 FPS View Transitions */
    .page-view-enter {

    @keyframes pageViewEnter {
      0% { opacity: 0; transform: scale(0.95) translateY(12px); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }

    .modal-sheet-enter {
      animation: sheetEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes sheetEnter {
      0% { transform: translateY(100%) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }

    /* Apple Grouped Settings Card */
    .apple-glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(0, 255, 102, 0.05) 50%, rgba(0, 20, 8, 0.35) 100%);
      backdrop-filter: blur(35px) saturate(210%);
      -webkit-backdrop-filter: blur(35px) saturate(210%);
      border: 1.5px solid rgba(255, 255, 255, 0.3);

    /* Liquid Glass Input */
    .liquid-input {
      background: rgba(0, 255, 102, 0.08);
      border: 1.5px solid rgba(0, 255, 102, 0.35);
      border-top: 1.5px solid rgba(255, 255, 255, 0.45);

<body>
  <!-- WATER TOUCH 60 FPS RIPPLE CANVAS -->
  <canvas id="water-ripple-canvas"></canvas>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========================================================
    // ⚙️ EDITABLE SETTINGS VALUES IN HTML SCRIPT
    // Customize any of these values directly below!
    // ========================================================
    const APP_CONFIG = {
      appName: "TrackoVex",
      tagline: "A Simple Solution",
      version: "v3.2 Liquid Edition",
      buildNumber: "2026.10.12-PROD",
      supportEmail: "support@trackovex.io",
      supportPhone: "+1 (800) 555-TRACK",
      hardwareProtocol: "ESP32-S3 Ultra-Wideband & BLE 5.3",
      developerTeam: "TrackoVex Systems Engineering",
      aboutDescription: "TrackoVex provides hyper-accurate Ultra-Wideband & Bluetooth Low Energy direction finding. Experience hardware-synchronized ESP32 buzzer triggers, directional compass tracking, and precision micro-radar.",
      feedbackRecipient: "feedback@trackovex.io",
      helpUrl: "https://trackovex.io/help"
    };

    // ========================================================
    // WEB AUDIO SYNTHESIZERS (BUZZER + LIQUID TACTILE WATER SOUNDS)
    // ========================================================
    window.audioContextInstance = null;
    function getAudioContext() {
      if (!window.audioContextInstance) {
        window.audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (window.audioContextInstance.state === 'suspended') {
        window.audioContextInstance.resume();
      }
      return window.audioContextInstance;
    }

    // ESP32 High-Gain Piezo Buzzer
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [0.0, 0.15, 0.30, 0.45].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2730, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.45, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio output blocked:", e);
      }
    };

    // Soft Liquid Water Drop Sound for Navigation and Touches
    window.playLiquidDropSound = function(pitchMultiplier = 1) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(450 * pitchMultiplier, now);
        osc.frequency.exponentialRampToValueAtTime(1100 * pitchMultiplier, now + 0.06);
        osc.frequency.exponentialRampToValueAtTime(300 * pitchMultiplier, now + 0.14);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.16);
      } catch (e) {}
    };

    // ========================================================
    // 60 FPS WATER RIPPLE ENGINE (PHYSICS-LIKE CONCENTRIC WAVE RINGS)
    // ========================================================
    class WaterRippleManager {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.ripples = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate = this.animate.bind(this);
        requestAnimationFrame(this.animate);
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      addRipple(x, y) {
        // Multi-ring concentric wave shockwave (emulates water drop)
        const count = 3;
        for (let i = 0; i < count; i++) {
          this.ripples.push({
            x,
            y,
            radius: 8 + i * 4,
            maxRadius: 110 + i * 25,
            speed: 3.2 + i * 0.9,
            alpha: 0.85 - i * 0.15,
            decay: 0.016 + i * 0.004,
            lineWidth: 2.8 - i * 0.5,
            delay: i * 5
          });
        }
      }

      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const r = this.ripples[i];
          if (r.delay > 0) {
            r.delay--;
            continue;
          }

          r.radius += r.speed;
          r.alpha -= r.decay;

          if (r.alpha <= 0 || r.radius >= r.maxRadius) {
            this.ripples.splice(i, 1);
            continue;
          }

          this.ctx.save();
          this.ctx.beginPath();
          this.ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);

          // Water refraction glow
          const grad = this.ctx.createRadialGradient(r.x, r.y, Math.max(0, r.radius - 8), r.x, r.y, r.radius + 6);
          grad.addColorStop(0, `rgba(0, 255, 102, 0)`);
          grad.addColorStop(0.7, `rgba(0, 255, 102, ${r.alpha * 0.8})`);
          grad.addColorStop(0.9, `rgba(255, 255, 255, ${r.alpha * 0.95})`);
          grad.addColorStop(1, `rgba(0, 255, 102, 0)`);

          this.ctx.strokeStyle = grad;
          this.ctx.lineWidth = r.lineWidth;
          this.ctx.shadowBlur = 12;
          this.ctx.shadowColor = '#00ff66';
          this.ctx.stroke();

          // Inner water specular circle
          this.ctx.beginPath();
          this.ctx.arc(r.x, r.y, r.radius * 0.6, 0, Math.PI * 2);
          this.ctx.strokeStyle = `rgba(255, 255, 255, ${r.alpha * 0.25})`;
          this.ctx.lineWidth = 1;
          this.ctx.stroke();

          this.ctx.restore();
        }

        requestAnimationFrame(this.animate);
      }
    }

    // Lucide Icon Component
    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className={`inline-flex items-center justify-center align-middle ${className}`} style={{ width: size, height: size }}></span>;
    };

    // ========================================================
    // 1. INTRO SPLASH SCREEN WITH LIQUID GLASS BUTTON
    // ========================================================
    function IntroSplash({ onContinue }) {
      const [step, setStep] = useState(1);
      const [isFadingOut, setIsFadingOut] = useState(false);

      const handleProceed = () => {
        window.playLiquidDropSound(1.2);
        if (step === 1) {
          setStep(2);
        } else {
          setIsFadingOut(true);
          setTimeout(() => {
            onContinue();
          }, 550);
        }
      };

      return (
        <div className={`fixed inset-0 z-50 bg-[#011307] flex flex-col justify-between px-8 py-12 transition-all duration-700 select-none ${
          isFadingOut ? 'opacity-0 scale-105 filter blur-md pointer-events-none' : 'opacity-100 scale-100'
        }`}>
          {/* Progress Indicators */}
          <div className="flex justify-center pt-2">
            <div className="flex gap-2.5 p-1.5 rounded-full liquid-glass-card">
              <span className={`h-2 rounded-full transition-all duration-500 ${step === 1 ? 'w-8 bg-[#00ff66] shadow-[0_0_12px_#00ff66]' : 'w-2 bg-white/20'}`}></span>
              <span className={`h-2 rounded-full transition-all duration-500 ${step === 2 ? 'w-8 bg-[#00ff66] shadow-[0_0_12px_#00ff66]' : 'w-2 bg-white/20'}`}></span>
            </div>
          </div>

          {/* Central Disc Feature */}
          <div className="flex-1 flex flex-col items-center justify-center my-4">
            <div className="relative animate-float-disc flex items-center justify-center mb-8">
              {/* Liquid Ripple Aura Rings */}
              <div className="absolute w-72 h-72 rounded-full border border-[#00ff66]/30 animate-wave-expand pointer-events-none"></div>
              <div className="absolute w-80 h-80 rounded-full border border-white/20 animate-wave-expand pointer-events-none" style={{ animationDelay: '1.2s' }}></div>

              {/* 3D Glassmorphic Beacon Disc */}
              <div className="w-56 h-56 rounded-full p-2.5 liquid-bluetooth-sphere animate-liquid-glow flex items-center justify-center">
                <div className="w-full h-full rounded-full bg-gradient-to-tr from-white via-[#dcfce7] to-[#15803d] shadow-[inset_0_4px_10px_rgba(255,255,255,0.9),inset_0_-5px_10px_rgba(0,0,0,0.4)] flex items-center justify-center p-6 relative overflow-hidden">
                  <div className="absolute inset-1 rounded-full border border-emerald-400/60 pointer-events-none"></div>
                  
                  {/* Glowing Logo */}
                  <img 
                    src="logo_black.png" 
                    onError={(e) => {
                      // Fallback if logo_black.png is not found
                      e.target.onerror = null;
                      e.target.src = "logo.png";
                    }}
                    alt="TrackoVex" 
                    className="w-32 h-auto object-contain filter contrast-125 drop-shadow-[0_2px_8px_rgba(0,0,0,0.3)]"
                  />
                </div>
              </div>
            </div>

            <div className="text-center px-4 max-w-sm">
              <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight leading-tight">
                {step === 1 ? "Lose your knack for losing things." : "Precision ESP32 Find."}
              </h1>
              <p className="text-sm text-emerald-300/90 mt-2.5 font-medium tracking-wide">
                TrackoVex • {APP_CONFIG.tagline}
              </p>
            </div>
          </div>

          {/* LIQUID GLASS CONTINUE BUTTON */}
          <div className="w-full flex justify-center pb-2">
            <button 
              onClick={handleProceed}

    // ==========================================
    // 2. CANVAS RADAR RING (NEON GREEN 60 FPS)
    // ==========================================
    function ParticleRadarRing() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const size = Math.min(window.innerWidth * 0.85, 340);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        const baseRadius = size * 0.38;

        const particleCount = 130;
        const particles = Array.from({ length: particleCount }).map(() => ({
          angle: Math.random() * Math.PI * 2,
          radiusOffset: (Math.random() - 0.5) * 44,
          speed: 0.007 + Math.random() * 0.014,
          baseSize: 1.8 + Math.random() * 3.4,
          alpha: 0.25 + Math.random() * 0.75,
          pulseSpeed: 0.02 + Math.random() * 0.04
        }));

        let sweepAngle = 0;

        const render = () => {
          ctx.clearRect(0, 0, size, size);

          // Subtle Radar Sweep Beam
          sweepAngle += 0.035;
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(sweepAngle);
          const sweepGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, baseRadius + 30);
          sweepGrad.addColorStop(0, 'rgba(0, 255, 102, 0.25)');
          sweepGrad.addColorStop(1, 'rgba(0, 255, 102, 0)');
          ctx.fillStyle = sweepGrad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, baseRadius + 25, 0, 0.45);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // Concentric Glass Circles
          [0.35, 0.65, 1].forEach((factor, idx) => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseRadius * factor, 0, Math.PI * 2);
            ctx.strokeStyle = idx === 2 ? 'rgba(0, 255, 102, 0.45)' : 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = idx === 2 ? 2 : 1;
            ctx.stroke();
          });

          // Particles
          particles.forEach(p => {
            p.angle += p.speed;
            p.alpha += Math.sin(Date.now() * 0.003 * p.pulseSpeed) * 0.02;
            const currentAlpha = Math.max(0.2, Math.min(0.95, p.alpha));

            const currentR = baseRadius + p.radiusOffset + Math.sin(p.angle * 3) * 6;
            const x = centerX + Math.cos(p.angle) * currentR;
            const y = centerY + Math.sin(p.angle) * currentR;

            ctx.beginPath();
            ctx.arc(x, y, p.baseSize, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 102, ${currentAlpha})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ff66";
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      return (
        <div className="relative flex items-center justify-center">
          <canvas ref={canvasRef} className="block select-none pointer-events-none" />
        </div>
      );
    }

                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleUnpair(dev.id);
                                }}
                                className="w-8 h-8 rounded-full bg-white/10 hover:bg-rose-500/30 text-rose-300 flex items-center justify-center transition-all"
                                title="Delete beacon"
                              >
                                <Icon name="trash-2" size={14} />
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

            </main>
          )}

          {/* ========================================================
              VIEW 2: TRACKING VIEW (NO DOCK HERE - REMOVED AS REQUESTED)
              ======================================================== */}
          {currentView === 'tracking' && currentDevice && (
            <div className="flex-1 w-full flex flex-col justify-between px-6 pb-12 page-view-enter z-20">
              
              {/* Central Radar or Arrow Canvas */}
              <div className="flex-1 flex flex-col items-center justify-center relative">
                {searchState === "searching" ? (
                  <ParticleRadarRing />
                ) : (
                  <DirectionArrowView angle={arrowAngle} />
                )}
              </div>

              {/* Bottom Precision Readout */}
              <div className="w-full liquid-glass-panel rounded-[32px] p-6 space-y-4 specular-gloss shadow-2xl">
                <div className="flex items-baseline justify-between">
                  <div>
                    <div className="text-[10px] font-extrabold uppercase tracking-widest text-emerald-300">Estimated Distance</div>
                    <div className="flex items-baseline gap-2 mt-0.5">
                      <span className="text-5xl font-black text-white font-sans">
                        {searchState === "searching" ? "--" : distanceVal}
                      </span>
                      <span className="text-3xl font-light text-[#00ff66] font-sans">
                        {distanceUnit}
                      </span>
                    </div>
                    {searchState === "found" && (
                      <div className="text-lg font-medium text-emerald-200 mt-1">
                        Bearing: <span className="text-[#00ff66] font-bold">{directionLabel}</span>
                      </div>
                    )}
                  </div>

                  {/* Toggle Units (ft/m) */}
                  <button 
                    onClick={() => {
                      window.playLiquidDropSound();
                      setDistanceUnit(u => u === 'ft' ? 'm' : 'ft');
                    }}
                    className="px-3 py-1.5 rounded-full liquid-secondary-btn text-xs font-mono font-bold text-[#00ff66]"
                  >
                    Unit: {distanceUnit.toUpperCase()}
                  </button>
                </div>

                {/* Bottom Actions inside Tracking Screen */}
                <div className="flex items-center justify-between pt-2">
                  <button 
                    onClick={() => {
                      window.playLiquidDropSound();
                      setCurrentView('home');
                    }}
                    className="px-5 py-3 rounded-2xl liquid-secondary-btn text-xs font-bold text-white flex items-center gap-2"
                  >
                    <Icon name="arrow-left" size={16} />
                    <span>Exit Tracking</span>
                  </button>

                  <button 
                    onClick={handleTriggerBuzzer}
                    className={`px-5 py-3 rounded-2xl liquid-circle-btn flex items-center gap-2 font-bold text-xs ${
                      isBuzzerSounding ? 'liquid-circle-buzzer-active animate-buzzer-ping text-rose-200' : 'text-[#00ff66]'
                    }`}
                  >
                    <Icon name={isBuzzerSounding ? "bell-ring" : "volume-2"} size={18} />
                    <span>{isBuzzerSounding ? "Sounding..." : "Ring Buzzer"}</span>
                  </button>
                </div>
              </div>

            </div>
          )}

          {/* ========================================================
              VIEW 3: PAIRING VIEW (NO DOCK HERE - REMOVED AS REQUESTED)
              ======================================================== */}
          {currentView === 'pairing' && (
            <div className="flex-1 w-full px-6 py-4 flex flex-col justify-between page-view-enter z-20">
              <div className="flex-1 flex flex-col items-center justify-center text-center">
                
                {bleStatus === "scanning" && (
                  <div className="space-y-6">
                    {/* Glowing Liquid Sphere with Wave shockwaves */}
                    <div className="relative flex items-center justify-center">
                      <div className="absolute w-48 h-48 rounded-full border border-[#00ff66]/30 animate-wave-expand pointer-events-none"></div>
                      <div className="absolute w-60 h-60 rounded-full border border-white/20 animate-wave-expand pointer-events-none" style={{ animationDelay: '1s' }}></div>

                      <div className="w-32 h-32 rounded-full liquid-bluetooth-sphere animate-liquid-glow flex items-center justify-center">
                        <Icon name="bluetooth-searching" size={44} className="text-white animate-spin" />
                      </div>
                    </div>

                    <div>
                      <h3 className="text-2xl font-extrabold text-white">Scanning for ESP32 Signals</h3>
                      <p className="text-xs text-emerald-200/80 mt-2 max-w-xs">
                        Keep your beacon within 5 meters. Make sure BLE advertisement is powered ON.
                      </p>
                    </div>
                  </div>
                )}

                {bleStatus === "discovered" && discoveredESP && (
                  <div className="w-full max-w-sm liquid-glass-panel rounded-[32px] p-6 space-y-5 specular-gloss">
                    <div className="w-20 h-20 rounded-full liquid-bluetooth-sphere mx-auto flex items-center justify-center">
                      <Icon name="check" size={34} className="text-white stroke-[3]" />
                    </div>

                    <div className="text-center">
                      <span className="text-[10px] font-extrabold uppercase tracking-widest text-[#00ff66]">Beacon Discovered</span>
                      <h3 className="text-2xl font-black text-white mt-1">{discoveredESP.rawName}</h3>
                      <p className="text-xs font-mono text-emerald-300 mt-1">RSSI: {discoveredESP.rssi} • Battery: {discoveredESP.battery}%</p>
                    </div>

                    <div className="p-4 rounded-2xl liquid-glass-card space-y-2 text-left">
                      <div className="flex justify-between text-xs">
                        <span className="text-emerald-200">Protocol:</span>
                        <span className="font-mono text-white">ESP32-S3 UWB 5.3</span>
                      </div>
                      <div className="flex justify-between text-xs">
                        <span className="text-emerald-200">Pairing Key:</span>
                        <span className="font-mono text-[#00ff66]">Direct Hardware Lock</span>
                      </div>
                    </div>

                    <button 
                      onClick={confirmPairDevice}
                      className="w-full py-4 rounded-2xl liquid-glass-btn text-black font-extrabold text-sm shadow-2xl"
                    >
                      Connect & Save Beacon
                    </button>
                  </div>
                )}
              </div>

              <div className="pb-6">
                <button 
                  onClick={() => {
                    window.playLiquidDropSound();
                    setCurrentView('home');
                  }}
                  className="w-full py-3.5 rounded-2xl liquid-secondary-btn text-xs font-bold text-emerald-200"
                >
                  Cancel Scan
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              VIEW 4: SETTINGS VIEW (NO DOCK HERE - REMOVED AS REQUESTED)
              Features: Customer Feedback, Support Mail, Editable HTML Items
              ======================================================== */}
          {currentView === 'settings' && (
            <div className="flex-1 w-full px-6 py-2 overflow-y-auto page-view-enter z-20 space-y-6 pb-12">
              
              {/* GROUP 1: CUSTOMER FEEDBACK FEATURE */}
              <div className="space-y-2">
                <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                  <Icon name="message-square" size={14} />
                  <span>Customer Feedback</span>
                </div>
                
                <div className="apple-glass-card p-5 space-y-4">
                  <div className="text-xs text-emerald-100/90 leading-relaxed">
                    Have thoughts or suggestions on the hardware or fluid UI? Help us improve TrackoVex.
                  </div>

                  <form onSubmit={handleFeedbackSubmit} className="space-y-3.5">
                    {/* Star Rating Selector */}
                    <div>
                      <label className="text-[11px] font-semibold text-emerald-300 block mb-1">Experience Rating</label>
                      <div className="flex items-center gap-2">
                        {[1, 2, 3, 4, 5].map((star) => (
                          <button
                            type="button"
                            key={star}
                            onClick={() => {
                              window.playLiquidDropSound(1 + star * 0.1);
                              setFeedbackRating(star);
                            }}
                            className="p-1 transition-transform active:scale-90"
                          >
                            <Icon 
                              name="star" 
                              size={22} 
                              className={star <= feedbackRating ? "text-[#00ff66] fill-[#00ff66]" : "text-white/20"} 
                            />
                          </button>
                        ))}
                        <span className="text-xs font-mono text-emerald-200 ml-2">{feedbackRating} / 5 Stars</span>
                      </div>
                    </div>

                    {/* Feedback Category */}
                    <div>
                      <label className="text-[11px] font-semibold text-emerald-300 block mb-1">Feedback Category</label>
                      <select 
                        value={feedbackCategory}
                        onChange={(e) => setFeedbackCategory(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl liquid-input text-xs font-medium"
                      >
                        <option value="General Feedback" className="bg-[#011a0b] text-white">General UI/UX Feedback</option>
                        <option value="ESP32 Buzzer" className="bg-[#011a0b] text-white">ESP32 Buzzer & Sound</option>
                        <option value="Precision Tracking" className="bg-[#011a0b] text-white">Precision Tracking / Radar</option>
                        <option value="Feature Request" className="bg-[#011a0b] text-white">New Feature Request</option>
                        <option value="Bug Report" className="bg-[#011a0b] text-white">Bug Report</option>
                      </select>
                    </div>

                    {/* Textarea */}
                    <div>
                      <label className="text-[11px] font-semibold text-emerald-300 block mb-1">Your Comments</label>
                      <textarea 
                        rows="3"
                        value={feedbackComment}
                        onChange={(e) => setFeedbackComment(e.target.value)}
                        placeholder="Write your suggestions here..."
                        required
                        className="w-full p-3 rounded-xl liquid-input text-xs resize-none"
                      ></textarea>
                    </div>

                    <button 
                      type="submit"
                      disabled={feedbackSubmitted}
                      className="w-full py-3 rounded-xl liquid-glass-btn text-black font-extrabold text-xs shadow-lg active:scale-95 transition-all"
                    >
                      {feedbackSubmitted ? "✓ Feedback Sent!" : "Submit Customer Feedback"}
                    </button>
                  </form>
                </div>
              </div>

              {/* GROUP 2: SUPPORT & CONTACT INFO */}
              <div className="space-y-2">
                <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                  <Icon name="life-buoy" size={14} />
                  <span>Support & Assistance</span>
                </div>

                <div className="apple-glass-card divide-y divide-white/10">
                  {/* Support Mail */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-rose-500/25 text-rose-300 flex items-center justify-center">
                        <Icon name="mail" size={16} />
                      </div>
                      <div>
                        <div className="text-xs font-bold text-white">Support Email</div>
                        <div className="text-[11px] font-mono text-emerald-300">{APP_CONFIG.supportEmail}</div>
                      </div>
                    </div>

                    <a 
                      href={`mailto:${APP_CONFIG.supportEmail}?subject=TrackoVex%20Support%20Request`}
                      className="px-3 py-1.5 rounded-full liquid-secondary-btn text-[11px] font-bold text-[#00ff66]"
                    >
                      Email Us
                    </a>
                  </div>

                  {/* Hotline */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-blue-500/25 text-blue-300 flex items-center justify-center">
                        <Icon name="phone" size={16} />
                      </div>
                      <div>
                        <div className="text-xs font-bold text-white">Helpline</div>
                        <div className="text-[11px] font-mono text-emerald-300">{APP_CONFIG.supportPhone}</div>
                      </div>
                    </div>

                    <button 
                      onClick={() => {
                        navigator.clipboard?.writeText(APP_CONFIG.supportPhone);
                        notify("Phone copied to clipboard!");
                      }}
                      className="px-3 py-1.5 rounded-full liquid-secondary-btn text-[11px] font-bold text-white"
                    >
                      Copy
                    </button>
                  </div>
                </div>
              </div>

              {/* GROUP 3: SYSTEM PREFERENCES & EDITABLE HARDWARE ITEMS */}
              <div className="space-y-2">
                <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2 flex items-center gap-1.5">
                  <Icon name="sliders" size={14} />
                  <span>Preferences & Hardware Specs</span>
                </div>

                <div className="apple-glass-card divide-y divide-white/10">
                  {/* Distance Units Switch */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-emerald-500/25 text-[#00ff66] flex items-center justify-center">
                        <Icon name="compass" size={16} />
                      </div>
                      <span className="text-xs font-semibold text-white">Measurement Units</span>
                    </div>
                    <div className="flex gap-1 p-1 rounded-full liquid-glass-card">
                      <button 
                        onClick={() => setDistanceUnit('ft')}
                        className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${
                          distanceUnit === 'ft' ? 'bg-[#00ff66] text-black shadow' : 'text-emerald-300'
                        }`}
                      >
                        Feet (ft)
                      </button>
                      <button 
                        onClick={() => setDistanceUnit('m')}
                        className={`px-3 py-1 rounded-full text-[11px] font-bold transition-all ${
                          distanceUnit === 'm' ? 'bg-[#00ff66] text-black shadow' : 'text-emerald-300'
                        }`}
                      >
                        Meters (m)
                      </button>
                    </div>
                  </div>

                  {/* Haptic Toggle */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-purple-500/25 text-purple-300 flex items-center justify-center">
                        <Icon name="smartphone" size={16} />
                      </div>
                      <span className="text-xs font-semibold text-white">Liquid Water Haptics</span>
                    </div>
                    <button 
                      onClick={() => setHapticEnabled(!hapticEnabled)}
                      className={`w-12 h-6 rounded-full transition-colors p-0.5 flex items-center ${
                        hapticEnabled ? 'bg-[#00ff66] justify-end' : 'bg-white/20 justify-start'
                      }`}
                    >
                      <span className="w-5 h-5 rounded-full bg-white shadow-md"></span>
                    </button>
                  </div>

                  {/* Hardware Protocol (Editable) */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-cyan-500/25 text-cyan-300 flex items-center justify-center">
                        <Icon name="cpu" size={16} />
                      </div>
                      <span className="text-xs font-semibold text-white">Hardware Protocol</span>
                    </div>
                    <span className="text-[11px] font-mono text-emerald-200">{APP_CONFIG.hardwareProtocol}</span>
                  </div>

                  {/* Version */}
                  <div className="p-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-xl bg-amber-500/25 text-amber-300 flex items-center justify-center">
                        <Icon name="tag" size={16} />
                      </div>
                      <span className="text-xs font-semibold text-white">Software Version</span>
                    </div>
                    <span className="text-[11px] font-mono font-bold text-[#00ff66] bg-[#00ff66]/20 px-2.5 py-1 rounded-full border border-[#00ff66]/30">
                      {APP_CONFIG.version}
                    </span>
                  </div>
                </div>
              </div>

              {/* ABOUT SECTION CARD */}
              <div className="apple-glass-card p-5 space-y-2">
                <div className="text-xs font-bold text-white flex items-center gap-2">
                  <Icon name="info" size={15} className="text-[#00ff66]" />
                  <span>About {APP_CONFIG.appName}</span>
                </div>
                <p className="text-xs text-emerald-100/80 leading-relaxed">
                  {APP_CONFIG.aboutDescription}
                </p>
                <div className="pt-2 text-[10px] text-emerald-300/70 font-mono">
                  Engineered by {APP_CONFIG.developerTeam} • Build {APP_CONFIG.buildNumber}
                </div>
              </div>

            </div>
          )}

          {/* ========================================================
              FLOATING LIQUID GLASS DOCK
              STRICTLY SHOWN ONLY ON HOMEPAGE!
              NOT ON TRACKING, PAIRING, OR SETTINGS!
              Includes fluid sliding active indicator & switch animations!
              ======================================================== */}
          {currentView === 'home' && (
            <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
              <div className="pointer-events-auto px-4 py-2.5 rounded-full liquid-floating-dock flex items-center gap-2 sm:gap-4 shadow-2xl animate-dock-bounce relative">
                
                {/* 1. HOME TAB */}
                <button 
                  onClick={() => {
                    window.playLiquidDropSound(1.0);
                    setDockActiveTab('home');
                    setCurrentView('home');
                  }}
                  className={`relative px-4 py-2 rounded-full flex flex-col items-center gap-1 transition-all duration-300 ${
                    dockActiveTab === 'home' ? 'liquid-dock-pill text-[#00ff66] scale-105' : 'text-white/70 hover:text-white'
                  }`}
                >
                  <Icon name="home" size={20} className="stroke-[2.2]" />
                  <span className="text-[10px] font-extrabold tracking-tight">Home</span>
                </button>

                {/* 2. ADD / PAIR TAB */}
                <button 
                  onClick={() => {
                    window.playLiquidDropSound(1.3);
                    setDockActiveTab('pair');
                    startBLEScan();
                  }}
                  className={`relative px-4 py-2 rounded-full flex flex-col items-center gap-1 transition-all duration-300 ${
                    dockActiveTab === 'pair' ? 'liquid-dock-pill text-[#00ff66] scale-105' : 'text-white/70 hover:text-white'
                  }`}
                >
                  <Icon name="plus-circle" size={20} className="stroke-[2.2]" />
                  <span className="text-[10px] font-extrabold tracking-tight">Pair</span>
                </button>

                {/* 3. SETTINGS TAB */}
                <button 
                  onClick={() => {
                    window.playLiquidDropSound(1.1);
                    setDockActiveTab('settings');
                    setCurrentView('settings');
                  }}
                  className={`relative px-4 py-2 rounded-full flex flex-col items-center gap-1 transition-all duration-300 ${
                    dockActiveTab === 'settings' ? 'liquid-dock-pill text-[#00ff66] scale-105' : 'text-white/70 hover:text-white'
                  }`}
                >
                  <Icon name="settings" size={20} className="stroke-[2.2]" />
                  <span className="text-[10px] font-extrabold tracking-tight">Settings</span>
                </button>

              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: RENAME BEACON
              ======================================================== */}
          {isRenaming && (
            <div 
              onClick={(e) => { e.stopPropagation(); setIsRenaming(false); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/75 backdrop-blur-2xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-sm rounded-[36px] liquid-glass-panel p-7 shadow-2xl space-y-4 specular-gloss modal-sheet-enter"
              >
                <div className="text-center">
                  <h3 className="text-xl font-extrabold text-white">Rename Beacon</h3>
                  <p className="text-xs text-emerald-200 mt-1">Assign a custom name to this beacon</p>
                </div>

                <div>
                  <input 
                    type="text"
                    value={renameInput}
                    onChange={(e) => setRenameInput(e.target.value)}
                    placeholder="e.g. Car Keys, Backpack"
                    autoFocus
                    className="w-full px-4 py-3.5 rounded-2xl liquid-input text-base font-semibold text-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => setIsRenaming(false)}
                    className="py-3 rounded-2xl liquid-secondary-btn text-xs font-bold text-white"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveRename}
                    className="py-3 rounded-2xl liquid-glass-btn text-black text-xs font-extrabold shadow-lg"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              DRAWER: MULTI-BEACON QUICK SWITCHER
              ======================================================== */}
          {showDeviceDrawer && (
            <div 
              onClick={(e) => { e.stopPropagation(); setShowDeviceDrawer(false); }}
              className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/80 backdrop-blur-2xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] liquid-glass-panel p-6 shadow-2xl space-y-4 specular-gloss modal-sheet-enter"
              >
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Select Active Beacon</h3>
                    <p className="text-xs text-emerald-300">Switch current tracking focus</p>
                  </div>
                  <button onClick={() => setShowDeviceDrawer(false)} className="p-1 text-emerald-300 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="space-y-2.5 max-h-60 overflow-y-auto">
                  {devices.map(dev => {
                    const isActive = dev.id === currentDevice?.id;
                    return (
                      <div 
                        key={dev.id}
                        onClick={() => {
                          window.playLiquidDropSound();
                          setActiveDeviceId(dev.id);
                          setShowDeviceDrawer(false);
                          notify(`Selected "${dev.name}"`);
                        }}
                        className={`p-3.5 rounded-2xl liquid-glass-card flex items-center justify-between cursor-pointer transition-all ${
                          isActive ? 'border-[#00ff66] bg-[#00ff66]/20' : 'hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                            isActive ? 'bg-[#00ff66] text-black font-bold' : 'bg-white/10 text-white'
                          }`}>
                            <Icon name="radio" size={18} />
                          </div>
                          <div>
                            <div className="text-sm font-bold text-white flex items-center gap-2">
                              <span>{dev.name}</span>
                              {isActive && <span className="w-2 h-2 rounded-full bg-[#00ff66]"></span>}
                            </div>
                            <div className="text-[11px] text-emerald-300 font-mono">Battery: {dev.battery}%</div>
                          </div>
                        </div>

                        <span className={`text-xs font-bold ${isActive ? 'text-[#00ff66]' : 'text-neutral-400'}`}>
                          {isActive ? "Active" : "Switch"}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <button 
                  onClick={() => {
                    setShowDeviceDrawer(false);
                    startBLEScan();
                  }}
                  className="w-full py-3.5 rounded-2xl liquid-glass-btn text-black text-xs font-extrabold shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="plus" size={16} />
                  <span>Pair Another TrackoVex</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount the Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
