  <!-- Web Audio ESP32 Buzzer Sound Synthesizer -->
  <script>
    // ESP32 Active Buzzer Alarm Pattern (Loud Harmonic Piezo Ring)
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        // 4 rapid sharp pulses typical of hardware ESP32 piezo active buzzers (2730Hz)
        [0.0, 0.16, 0.32, 0.48].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2730, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.42, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio autoplay blocked:", e);
      }
    };
  </script>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- Lucide Icon Helper ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className={`inline-flex items-center justify-center align-middle ${className}`} style={{ width: size, height: size }}></span>;
    };

    // ==========================================
    // 1. INTRO SPLASH SCREEN (TrackoVex Black Logo)
    // ==========================================
    function IntroSplash({ onContinue }) {
      const [step, setStep] = useState(1);
      const [animatingOut, setAnimatingOut] = useState(false);

      const handleProceed = () => {
        if (step === 1) {
          setStep(2);
        } else {
          setAnimatingOut(true);
          setTimeout(() => {
            onContinue();
          }, 700);
        }
      };

      return (
        <div className={`fixed inset-0 z-50 bg-black flex flex-col justify-between px-8 py-14 transition-all duration-700 select-none ${
          animatingOut ? 'opacity-0 scale-125 filter blur-md pointer-events-none' : 'opacity-100 scale-100'
        }`}>
          <div className="flex justify-center pt-2">
            <div className="flex gap-2">
              <span className={`w-2 h-2 rounded-full transition-all ${step === 1 ? 'w-6 bg-white' : 'bg-white/30'}`}></span>
              <span className={`w-2 h-2 rounded-full transition-all ${step === 2 ? 'w-6 bg-white' : 'bg-white/30'}`}></span>
            </div>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center">
            <div className="relative animate-float-disc flex items-center justify-center mb-10">
              <div className="w-56 h-56 rounded-full p-2 bg-gradient-to-tr from-slate-300 via-white to-slate-400 shadow-[0_25px_60px_rgba(255,255,255,0.15)] flex items-center justify-center">
                <div className="w-full h-full rounded-full airtag-disc-3d flex items-center justify-center p-6 relative overflow-hidden">
                  <div className="absolute inset-2 rounded-full border border-slate-300/60 pointer-events-none"></div>
                  <img 
                    src="logo_black.jpg" 
                    alt="TrackoVex" 
                    className="w-32 h-auto object-contain filter contrast-125"
                  />
                </div>
              </div>
            </div>

            <div className="text-center px-4 max-w-xs">
              <h1 className="text-3xl font-extrabold text-white tracking-tight leading-snug">
                {step === 1 ? "Lose your knack for losing things." : "MiniProject III."}
              </h1>
              <p className="text-sm text-slate-400 mt-2 font-medium">
                TrackoVex • A Simple Solution
              </p>
            </div>
          </div>

          <div className="w-full flex justify-center pb-2">
            <button 
              onClick={handleProceed}
              className="w-full max-w-sm py-4 rounded-full bg-white text-black text-base font-bold tracking-tight shadow-xl hover:bg-slate-100 active:scale-95 transition-all"
            >
              Continue
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. CANVAS-BASED SWARMING DOTS RADAR RING
    // ==========================================
    function ParticleRadarRing() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const size = Math.min(window.innerWidth * 0.85, 340);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        const baseRadius = size * 0.38;

        const particleCount = 115;
        const particles = Array.from({ length: particleCount }).map(() => ({
          angle: Math.random() * Math.PI * 2,
          radiusOffset: (Math.random() - 0.5) * 44,
          speed: 0.006 + Math.random() * 0.012,
          baseSize: 1.8 + Math.random() * 3.2,
          alpha: 0.2 + Math.random() * 0.8,
          pulseSpeed: 0.02 + Math.random() * 0.04
        }));

        const render = () => {
          ctx.clearRect(0, 0, size, size);

          particles.forEach(p => {
            p.angle += p.speed;
            p.alpha += Math.sin(Date.now() * 0.003 * p.pulseSpeed) * 0.02;
            const currentAlpha = Math.max(0.15, Math.min(0.95, p.alpha));

            const currentR = baseRadius + p.radiusOffset + Math.sin(p.angle * 3) * 6;
            const x = centerX + Math.cos(p.angle) * currentR;
            const y = centerY + Math.sin(p.angle) * currentR;

            ctx.beginPath();
            ctx.arc(x, y, p.baseSize, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="relative flex items-center justify-center">
          <canvas ref={canvasRef} className="block select-none pointer-events-none" />
        </div>
      );
    }

    // ==========================================
    // 3. MINIMAL DIRECTION ARROW WITH ARC
    // ==========================================
    function DirectionArrowView({ angle = 45 }) {
      return (
        <div className="relative flex flex-col items-center justify-center my-6">
          <div className="relative w-64 h-64 flex items-center justify-center">
            
            <svg className="absolute w-56 h-56 pointer-events-none" viewBox="0 0 100 100">
              <path 
                d="M 50,15 A 35,35 0 0,1 85,50" 
                fill="none" 
                stroke="rgba(255, 255, 255, 0.45)" 
                strokeWidth="4" 
                strokeLinecap="round" 
              />
              <circle cx="50" cy="15" r="3.5" fill="rgba(255, 255, 255, 0.6)" />
              <circle cx="85" cy="50" r="3.5" fill="#ffffff" />
            </svg>

            <div 
              className="relative transition-transform duration-500 ease-out"
              style={{ transform: `rotate(${angle}deg)` }}
            >
              <svg width="140" height="140" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path 
                  d="M 28,72 L 68,32 M 68,32 L 38,32 M 68,32 L 68,62" 
                  stroke="#ffffff" 
                  strokeWidth="14" 
                  strokeLinecap="round" 
                  strokeLinejoin="round" 
                />
              </svg>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. MAIN AIRTAG HOMEPAGE COMPONENT
    // ==========================================
    function TrackoVexApp() {
      const [showIntro, setShowIntro] = useState(true);
      
      // Multiple devices array
      const [devices, setDevices] = useState([]);
      const [activeDeviceId, setActiveDeviceId] = useState(null);

      // Search state: 'searching' vs 'found'
      const [searchState, setSearchState] = useState("searching");
      
      // Dynamic simulated distance and angle
      const [distanceVal, setDistanceVal] = useState(7);
      const [directionLabel, setDirectionLabel] = useState("to your right");
      const [arrowAngle, setArrowAngle] = useState(0);

      // Buzzer Active state
      const [isBuzzerSounding, setIsBuzzerSounding] = useState(false);

      // Bluetooth Scanner Modal State
      const [isScanningBLE, setIsScanningBLE] = useState(false);
      const [bleStatus, setBleStatus] = useState("idle");
      const [discoveredESP, setDiscoveredESP] = useState(null);

      // Multiple Device Switcher Drawer State
      const [showDeviceDrawer, setShowDeviceDrawer] = useState(false);

      // Renaming State
      const [isRenaming, setIsRenaming] = useState(false);
      const [renameInput, setRenameInput] = useState("");

      // Feedback Toast
      const [toastMsg, setToastMsg] = useState(null);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Get Active Selected Device
      const currentDevice = useMemo(() => {
        return devices.find(d => d.id === activeDeviceId) || devices[0] || null;
      }, [devices, activeDeviceId]);

      // TRIGGER ALERT BUZZER ON THE PRE-INSTALLED BOTTOM BUTTON
      const handleTriggerBottomBuzzer = () => {
        setIsBuzzerSounding(true);
        window.triggerESP32BuzzerAlarm();
        notify(`🚨 Buzzer Sounding on ${currentDevice?.name || "TrackoVex"} (ESP32)!`);
        setTimeout(() => setIsBuzzerSounding(false), 2200);
      };

      // Periodic UWB distance and angle jitter
      useEffect(() => {
        if (!currentDevice) return;
        const interval = setInterval(() => {
          if (searchState === "found") {
            setDistanceVal(prev => {
              const delta = (Math.random() * 2 - 1);
              return Math.max(1, Math.round(prev + delta));
            });
            setArrowAngle(prev => (prev + (Math.random() * 10 - 5)));
          }
        }, 1600);
        return () => clearInterval(interval);
      }, [currentDevice, searchState]);

      // Web Bluetooth / Simulated ESP32 BLE Connect
      const startBLEScan = async () => {
        setIsScanningBLE(true);
        setBleStatus("scanning");

        if (navigator.bluetooth) {
          try {
            const dev = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: ['battery_service']
            });
            if (dev) {
              setDiscoveredESP({
                id: dev.id || `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
                rawName: dev.name || `ESP32_TrackoVex_${devices.length + 1}`,
                rssi: "-50 dBm",
                battery: 100
              });
              setBleStatus("discovered");
              return;
            }
          } catch (e) {
            console.log("Web Bluetooth fallback:", e);
          }
        }

        // ESP32 Discovery Simulation
        setTimeout(() => {
          const count = devices.length + 1;
          setDiscoveredESP({
            id: `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
            rawName: `ESP32_TrackoVex_Unit_${count}`,
            rssi: "-48 dBm",
            battery: count === 1 ? 94 : (count === 2 ? 82 : 75)
          });
          setBleStatus("discovered");
        }, 1600);
      };

      // Pair & Register
      const confirmPairDevice = () => {
        if (!discoveredESP) return;
        const defaultNames = ["Ben’s Camera", "Car Keys", "MacBook Sleeve", "Travel Suitcase"];
        const nameToUse = defaultNames[devices.length % defaultNames.length];
        
        const newDevice = {
          id: discoveredESP.id,
          name: nameToUse,
          battery: discoveredESP.battery || 100,
          rawName: discoveredESP.rawName,
          pairedTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updated = [...devices, newDevice];
        setDevices(updated);
        setActiveDeviceId(newDevice.id);
        setSearchState("searching");
        setIsScanningBLE(false);
        setDiscoveredESP(null);
        setBleStatus("idle");
        notify(`Paired "${newDevice.name}" successfully!`);

        setTimeout(() => {
          setSearchState("found");
          setDistanceVal(Math.floor(4 + Math.random() * 7));
          notify(`Signal locked on ${newDevice.name}!`);
        }, 2800);
      };

      // Rename handlers
      const openRename = (dev) => {
        setRenameInput(dev.name);
        setIsRenaming(true);
      };

      const saveRename = () => {
        if (!renameInput.trim() || !currentDevice) return;
        const clean = renameInput.trim();
        setDevices(prev => prev.map(d => d.id === currentDevice.id ? { ...d, name: clean } : d));
        setIsRenaming(false);
        notify(`Renamed to "${clean}"`);
      };

      const handleUnpair = () => {
        if (!currentDevice) return;
        const remaining = devices.filter(d => d.id !== currentDevice.id);
        setDevices(remaining);
        setActiveDeviceId(remaining[0]?.id || null);
        notify(`Removed "${currentDevice.name}"`);
      };

      return (
        <div className="relative w-screen h-screen flex flex-col bg-black text-white overflow-hidden select-none font-sans">
          
          {/* 1. Animated Intro Zoom-Out Splash */}
          {showIntro && (
            <IntroSplash onContinue={() => setShowIntro(false)} />
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 inset-x-6 z-50 flex items-center justify-center pointer-events-none">
              <div className="px-5 py-2.5 rounded-full ios-liquid-glass shadow-2xl text-white text-xs font-semibold flex items-center gap-2 animate-bounce">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {/* ========================================================
              TOP STATUS BAR & HEADER
              - Uppercase "FINDING"
              - Device Title with Rename Pencil
              - Real-Time Battery Indicator
              - Upper Space Controls: [View Radar/Arrow] + [+] Plus Button to Add/Switch Multiple TrackoVex
              ======================================================== */}
          <div className="w-full pt-12 px-6 pb-3 flex items-start justify-between z-20">
            <div>
              {/* Finding Label */}
              <div className="text-[12px] font-bold uppercase tracking-wider text-neutral-400 font-sans">
                {currentDevice ? (searchState === "searching" ? "FINDING" : "NEARBY") : "TRACKOVEX"}
              </div>

              {/* Title: Device Name (Apple SF Pro Font) */}
              <div className="flex items-center gap-2 mt-0.5">
                <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white font-sans truncate max-w-[190px] sm:max-w-xs">
                  {currentDevice ? currentDevice.name : "No Device Paired"}
                </h1>
                {currentDevice && (
                  <button 
                    onClick={() => openRename(currentDevice)}
                    className="p-1 rounded-full text-neutral-400 hover:text-white transition-colors"
                    title="Rename"
                  >
                    <Icon name="edit-2" size={15} />
                  </button>
                )}
              </div>

              {/* Real-time Battery Indicator (Apple iOS Style) */}
              {currentDevice && (
                <div className="flex items-center gap-1.5 mt-1.5">
                  <div className="relative flex items-center">
                    <div className="w-6 h-3 rounded-[4px] border border-white/60 p-[1.5px] flex items-center">
                      <div 
                        className={`h-full rounded-[2px] transition-all duration-500 ${
                          currentDevice.battery > 20 ? 'bg-[#30d158]' : 'bg-[#ff453a]'
                        }`}
                        style={{ width: `${currentDevice.battery}%` }}
                      ></div>
                    </div>
                    <div className="w-[2px] h-[5px] bg-white/60 rounded-r-[1px] ml-[1px]"></div>
                  </div>
                  <span className="text-[11px] font-semibold text-neutral-300 font-mono tracking-tight">
                    {currentDevice.battery}%
                  </span>
                  <span className="text-[10px] text-neutral-500 ml-1">• ESP32 BLE</span>
                </div>
              )}
            </div>

            {/* UPPER SPACE ACTION CONTROLS:
                1. "View Radar" / "View Arrow" Toggle Button
                2. [+] Plus Key Button (Near View Radar) to add/access 2+ TrackoVex simultaneously
            */}
            <div className="flex items-center gap-2 pt-1">
              {currentDevice && (
                <button 
                  onClick={() => setSearchState(prev => prev === 'searching' ? 'found' : 'searching')}
                  className="px-3 py-2 rounded-full ios-liquid-btn text-[11px] font-bold text-neutral-200"
                  title="Toggle Searching / Found State"
                >
                  {searchState === 'searching' ? "View Arrow" : "View Radar"}
                </button>
              )}

              {/* [+] Plus Key at Upper Space near View Radar */}
              <button 
                onClick={startBLEScan}
                className="w-10 h-10 rounded-full ios-liquid-btn flex items-center justify-center text-white hover:text-blue-400 shadow-lg active:scale-90"
                title="Add Another TrackoVex Beacon via BLE"
              >
                <Icon name="plus" size={20} className="stroke-[2.5]" />
              </button>

              {/* Multi-Device Pill Selector (shown if 2+ devices paired) */}
              {devices.length > 1 && (
                <button 
                  onClick={() => setShowDeviceDrawer(true)}
                  className="px-2.5 py-1.5 rounded-full ios-liquid-btn text-[11px] font-bold text-blue-400 flex items-center gap-1"
                  title="Switch Active Device"
                >
                  <Icon name="layers" size={13} />
                  <span>{devices.length}</span>
                </button>
              )}
            </div>
          </div>

          {/* ========================================================
              CENTER CANVAS: MINIMAL DIRECTION ARROW & SWARMING DOTS
              ======================================================== */}
          <div className="flex-1 w-full flex flex-col items-center justify-center relative px-6 z-10">
            
            {!currentDevice && (
              <div className="flex flex-col items-center justify-center text-center p-8">
                <div className="w-24 h-24 rounded-full ios-liquid-glass flex items-center justify-center mb-6 shadow-2xl">
                  <Icon name="bluetooth" size={38} className="text-blue-500" />
                </div>
                <h2 className="text-xl font-bold text-white">No TrackoVex AirTag Found</h2>
                <p className="text-sm text-neutral-400 max-w-xs mt-2 leading-relaxed">
                  Power ON your Bluetooth beacon and tap the plus key to pair multiple units.
                </p>
                <button 
                  onClick={startBLEScan}
                  className="mt-6 px-7 py-3.5 rounded-full bg-white text-black text-sm font-bold shadow-2xl active:scale-95 transition-transform"
                >
                  Pair TrackoVex (BLE)
                </button>
              </div>
            )}

            {currentDevice && (
              <div className="w-full flex flex-col items-center justify-center">
                {searchState === "searching" ? (
                  <div className="flex flex-col items-center justify-center animate-fade-in">
                    <ParticleRadarRing />
                  </div>
                ) : (
                  <div className="flex flex-col items-center justify-center animate-fade-in">
                    <DirectionArrowView angle={arrowAngle} />
                  </div>
                )}
              </div>
            )}

          </div>

          {/* ========================================================
              BOTTOM SECTION (MATCHING ORIGINAL AIRTAG INTERFACE LAYOUT)
              - Estimated Distance Readout at Bottom Left ("7 ft" / "11 ft" "to your right")
              - Pre-Installed Circular Buttons:
                * Left: Close (X) button
                * Right: ALERT BUZZER BUTTON (Pre-installed Speaker Button with Liquid Glass and Sounding state)
              ======================================================== */}
          {currentDevice && (
            <div className="w-full px-8 pb-12 pt-2 z-20 flex flex-col justify-end">
              
              {/* Estimated Distance Readout */}
              <div className="mb-6 select-none">
                <div className="flex items-baseline gap-2">
                  <span className="text-6xl sm:text-7xl font-extrabold tracking-tight text-white font-sans">
                    {searchState === "searching" ? "11" : distanceVal}
                  </span>
                  <span className="text-4xl sm:text-5xl font-light text-neutral-400 font-sans">
                    ft
                  </span>
                </div>

                {searchState === "found" && (
                  <div className="text-2xl sm:text-3xl font-normal text-neutral-400 tracking-tight mt-0.5 font-sans">
                    to your <span className="text-white font-bold">{directionLabel.replace("to your ", "")}</span>
                  </div>
                )}
              </div>

              {/* Bottom iOS Circular Buttons */}
              <div className="flex items-center justify-between">
                
                {/* Left: Circle 'X' Button to close / unpair */}
                <button 
                  onClick={handleUnpair}
                  className="w-16 h-16 rounded-full ios-circle-btn flex items-center justify-center text-white hover:text-rose-400"
                  title="Disconnect Device"
                >
                  <Icon name="x" size={26} className="stroke-[2.5]" />
                </button>

                {/* Right: PRE-INSTALLED CIRCULAR BUTTON WITH ALERT BUZZER INTEGRATION
                    Liquid Glass styling matching the UI + Active Buzzer sound feedback
                */}
                <button 
                  onClick={handleTriggerBottomBuzzer}
                  className={`w-16 h-16 rounded-full ios-circle-btn flex items-center justify-center transition-all ${
                    isBuzzerSounding ? 'ios-circle-btn-buzzer-active animate-buzzer-ping text-rose-300' : 'text-white'
                  }`}
                  title="Alert TrackoVex Buzzer (ESP32)"
                >
                  <Icon 
                    name={isBuzzerSounding ? "bell-ring" : "volume-2"} 
                    size={26} 
                    className={`stroke-[2.2] ${isBuzzerSounding ? 'animate-bounce text-rose-300' : ''}`} 
                  />
                </button>

              </div>

            </div>
          )}

          {/* ========================================================
              DRAWER: MULTI-TRACKOVEX BEACON SWITCHER
              ======================================================== */}
          {showDeviceDrawer && (
            <div className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/80 backdrop-blur-xl animate-fade-in">
              <div className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] ios-liquid-glass p-6 shadow-2xl space-y-4 border border-white/20">
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h3 className="text-lg font-bold text-white">Active TrackoVex Devices</h3>
                    <p className="text-xs text-neutral-400">Switch focus between connected beacons</p>
                  </div>
                  <button onClick={() => setShowDeviceDrawer(false)} className="p-1 text-neutral-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="space-y-2.5 max-h-60 overflow-y-auto">
                  {devices.map(dev => {
                    const isActive = dev.id === currentDevice?.id;
                    return (
                      <div 
                        key={dev.id}
                        onClick={() => {
                          setActiveDeviceId(dev.id);
                          setShowDeviceDrawer(false);
                          notify(`Switched focus to ${dev.name}`);
                        }}
                        className={`p-3.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all border ${
                          isActive 
                            ? 'bg-blue-600/25 border-blue-400 shadow-md' 
                            : 'bg-white/5 border-white/10 hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                            isActive ? 'bg-blue-500 text-white' : 'bg-white/10 text-neutral-300'
                          }`}>
                            <Icon name="radio" size={18} />
                          </div>
                          <div>
                            <div className="text-sm font-bold text-white flex items-center gap-2">
                              <span>{dev.name}</span>
                              {isActive && <span className="w-2 h-2 rounded-full bg-blue-400"></span>}
                            </div>
                            <div className="text-[11px] text-neutral-400 font-mono">Battery: {dev.battery}%</div>
                          </div>
                        </div>

                        <div className="text-right">
                          <span className={`text-xs font-semibold ${isActive ? 'text-blue-400' : 'text-neutral-400'}`}>
                            {isActive ? "Active" : "Select"}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button 
                  onClick={() => {
                    setShowDeviceDrawer(false);
                    startBLEScan();
                  }}
                  className="w-full py-3.5 rounded-2xl bg-white text-black text-xs font-bold shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="plus" size={16} />
                  <span>Pair Another TrackoVex</span>
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: RENAME DEVICE
              ======================================================== */}
          {isRenaming && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/75 backdrop-blur-xl animate-fade-in">
              <div className="w-full max-w-sm rounded-[32px] ios-liquid-glass p-7 shadow-2xl space-y-4 border border-white/20">
                <div className="text-center">
                  <h3 className="text-xl font-bold text-white">Rename TrackoVex</h3>
                  <p className="text-xs text-neutral-400 mt-1">Customize device label</p>
                </div>

                <div>
                  <input 
                    type="text"
                    value={renameInput}
                    onChange={(e) => setRenameInput(e.target.value)}
                    placeholder="e.g. Ben’s Camera, Car Keys, Backpack"
                    autoFocus
                    className="w-full px-4 py-3.5 rounded-2xl bg-white/10 border border-white/20 text-white text-base font-semibold focus:outline-none focus:ring-2 focus:ring-white"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => setIsRenaming(false)}
                    className="py-3 rounded-2xl bg-white/10 text-white text-xs font-bold hover:bg-white/20"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveRename}
                    className="py-3 rounded-2xl bg-white text-black text-xs font-bold shadow-lg active:scale-95 transition-all"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: ESP32 BLUETOOTH PAIRING
              ======================================================== */}
          {isScanningBLE && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-xl animate-fade-in">
              <div className="w-full sm:max-w-sm rounded-t-[36px] sm:rounded-[36px] ios-liquid-glass p-7 shadow-2xl space-y-5 border border-white/20">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="bluetooth" size={22} className="text-blue-400" />
                    <h3 className="text-lg font-bold text-white">Pair TrackoVex BLE</h3>
                  </div>
                  <button onClick={() => setIsScanningBLE(false)} className="p-1 text-neutral-400 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                {bleStatus === "scanning" && (
                  <div className="py-8 flex flex-col items-center text-center">
                    <div className="w-16 h-16 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-3 animate-spin">
                      <Icon name="radio" size={30} />
                    </div>
                    <p className="text-sm font-bold text-white">Listening for Bluetooth Signals...</p>
                    <p className="text-xs text-neutral-400 mt-1">Ensure your TrackoVex is nearby</p>
                  </div>
                )}

                {bleStatus === "discovered" && discoveredESP && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center">
                          <Icon name="cpu" size={20} />
                        </div>
                        <div>
                          <div className="text-sm font-bold text-white">{discoveredESP.rawName}</div>
                          <div className="text-[11px] text-neutral-400 font-mono">Battery: {discoveredESP.battery}%</div>
                        </div>
                      </div>
                      <span className="text-xs font-mono font-bold text-emerald-400">{discoveredESP.rssi}</span>
                    </div>

                    <button 
                      onClick={confirmPairDevice}
                      className="w-full py-4 rounded-2xl bg-white text-black text-xs font-bold shadow-xl active:scale-95 transition-all"
                    >
                      Connect & Begin Tracking
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
