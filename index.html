  <!-- Web Audio ESP32 Buzzer Sound Synthesizer -->
  <script>
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        [0.0, 0.16, 0.32, 0.48].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2730, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.42, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio autoplay blocked:", e);
      }
    };

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // 1. INTRO SPLASH SCREEN (NON-TRANSPARENT OPAQUE BG)

    function IntroSplash({ onContinue }) {

            <button

    }

    // ==========================================
    // 2. CANVAS RADAR RING (NEON GREEN)
    // ==========================================
    function ParticleRadarRing() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const size = Math.min(window.innerWidth * 0.85, 340);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        const baseRadius = size * 0.38;

        const particleCount = 120;
        const particles = Array.from({ length: particleCount }).map(() => ({
          angle: Math.random() * Math.PI * 2,
          radiusOffset: (Math.random() - 0.5) * 44,
          speed: 0.006 + Math.random() * 0.012,
          baseSize: 1.8 + Math.random() * 3.2,
          alpha: 0.2 + Math.random() * 0.8,
          pulseSpeed: 0.02 + Math.random() * 0.04
        }));

        const render = () => {
          ctx.clearRect(0, 0, size, size);

          particles.forEach(p => {
            p.angle += p.speed;
            p.alpha += Math.sin(Date.now() * 0.003 * p.pulseSpeed) * 0.02;
            const currentAlpha = Math.max(0.2, Math.min(0.95, p.alpha));

            const currentR = baseRadius + p.radiusOffset + Math.sin(p.angle * 3) * 6;
            const x = centerX + Math.cos(p.angle) * currentR;
            const y = centerY + Math.sin(p.angle) * currentR;

            ctx.beginPath();
            ctx.arc(x, y, p.baseSize, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 255, 102, ${currentAlpha})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ff66";
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <div className="relative flex items-center justify-center">
          <canvas ref={canvasRef} className="block select-none pointer-events-none" />
        </div>
      );
    }

    // ==========================================
    // 3. DIRECTION ARROW VIEW
    // ==========================================
    function DirectionArrowView({ angle = 45 }) {
      return (
        <div className="relative flex flex-col items-center justify-center my-6">
          <div className="relative w-64 h-64 flex items-center justify-center">
            <svg className="absolute w-56 h-56 pointer-events-none" viewBox="0 0 100 100">
              <path 
                d="M 50,15 A 35,35 0 0,1 85,50"

              />
              <circle cx="50" cy="15" r="3.5" fill="rgba(0, 255, 102, 0.7)" />
              <circle cx="85" cy="50" r="3.5" fill="#00ff66" />
            </svg>

            <div 
              className="relative transition-transform duration-500 ease-out"
              style={{ transform: `rotate(${angle}deg)` }}
            >
              <svg width="140" height="140" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path 
                  d="M 28,72 L 68,32 M 68,32 L 38,32 M 68,32 L 68,62" 
                  stroke="#00ff66" 
                  strokeWidth="14" 
                  strokeLinecap="round" 
                  strokeLinejoin="round" 
                />
              </svg>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. MAIN APPLICATION COMPONENT
    // ==========================================
    function TrackoVexApp() {
      const [showIntro, setShowIntro] = useState(true);
      const [devices, setDevices] = useState([]);
      const [activeDeviceId, setActiveDeviceId] = useState(null);
      const [searchState, setSearchState] = useState("searching");

      const [distanceVal, setDistanceVal] = useState(7);
      const [directionLabel, setDirectionLabel] = useState("to your right");
      const [arrowAngle, setArrowAngle] = useState(0);

      const [isBuzzerSounding, setIsBuzzerSounding] = useState(false);
      const [isScanningBLE, setIsScanningBLE] = useState(false);
      const [bleStatus, setBleStatus] = useState("idle");
      const [discoveredESP, setDiscoveredESP] = useState(null);

      // UI Drawer & Modal States
      const [showDeviceDrawer, setShowDeviceDrawer] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);

      // Renaming State
      const [isRenaming, setIsRenaming] = useState(false);
      const [renameInput, setRenameInput] = useState("");

      // Screen Ripple State
      const [ripples, setRipples] = useState([]);

      // Toast Notification
      const [toastMsg, setToastMsg] = useState(null);

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Handle Ripple Animation on Press
      const handleGlobalClick = (e) => {
        const x = e.clientX;
        const y = e.clientY;
        const id = Date.now();
        setRipples(prev => [...prev, { id, x, y }]);
        setTimeout(() => {
          setRipples(prev => prev.filter(r => r.id !== id));
        }, 600);
      };

      const currentDevice = useMemo(() => {
        return devices.find(d => d.id === activeDeviceId) || devices[0] || null;
      }, [devices, activeDeviceId]);

      const handleTriggerBottomBuzzer = () => {
        setIsBuzzerSounding(true);
        window.triggerESP32BuzzerAlarm();
        notify(`🚨 Buzzer Sounding on ${currentDevice?.name || "TrackoVex"}!`);
        setTimeout(() => setIsBuzzerSounding(false), 2200);
      };

      useEffect(() => {
        if (!currentDevice) return;
        const interval = setInterval(() => {
          if (searchState === "found") {
            setDistanceVal(prev => {
              const delta = (Math.random() * 2 - 1);
              return Math.max(1, Math.round(prev + delta));
            });
            setArrowAngle(prev => (prev + (Math.random() * 10 - 5)));
          }
        }, 1600);
        return () => clearInterval(interval);
      }, [currentDevice, searchState]);

      const startBLEScan = async () => {
        setIsScanningBLE(true);
        setBleStatus("scanning");

        if (navigator.bluetooth) {
          try {
            const dev = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: ['battery_service']
            });
            if (dev) {
              setDiscoveredESP({
                id: dev.id || `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
                rawName: dev.name || `ESP32_TrackoVex_${devices.length + 1}`,
                rssi: "-50 dBm",
                battery: 100
              });
              setBleStatus("discovered");
              return;
            }
          } catch (e) {
            console.log("Web Bluetooth fallback:", e);
          }
        }

        setTimeout(() => {
          const count = devices.length + 1;
          setDiscoveredESP({
            id: `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
            rawName: `ESP32_TrackoVex_Unit_${count}`,
            rssi: "-48 dBm",
            battery: count === 1 ? 94 : (count === 2 ? 82 : 75)
          });
          setBleStatus("discovered");
        }, 1600);
      };

      const confirmPairDevice = () => {
        if (!discoveredESP) return;
        const defaultNames = ["Camera", "Car Keys", "MacBook Sleeve", "Suitcase"];
        const nameToUse = defaultNames[devices.length % defaultNames.length];
        
        const newDevice = {
          id: discoveredESP.id,
          name: nameToUse,
          battery: discoveredESP.battery || 100,
          rawName: discoveredESP.rawName,
          pairedTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updated = [...devices, newDevice];
        setDevices(updated);
        setActiveDeviceId(newDevice.id);
        setSearchState("searching");
        setIsScanningBLE(false);
        setDiscoveredESP(null);
        setBleStatus("idle");
        notify(`Paired "${newDevice.name}" successfully!`);

        setTimeout(() => {
          setSearchState("found");
          setDistanceVal(Math.floor(4 + Math.random() * 7));
          notify(`Signal locked on ${newDevice.name}!`);
        }, 2800);
      };

      const openRename = (dev) => {
        if (!dev) {
          notify("No active device to rename!");
          return;
        }
        setRenameInput(dev.name);
        setIsRenaming(true);
      };

      const saveRename = () => {
        if (!renameInput.trim() || !currentDevice) return;
        const clean = renameInput.trim();
        setDevices(prev => prev.map(d => d.id === currentDevice.id ? { ...d, name: clean } : d));
        setIsRenaming(false);
        notify(`Renamed to "${clean}"`);
      };

      const handleUnpair = () => {
        if (!currentDevice) return;
        const remaining = devices.filter(d => d.id !== currentDevice.id);
        setDevices(remaining);
        setActiveDeviceId(remaining[0]?.id || null);
        notify(`Removed "${currentDevice.name}"`);
      };

      return (
        <div 
          onClick={handleGlobalClick}
          className="relative w-screen h-screen flex flex-col overflow-hidden select-none font-sans"
        >
          {/* SCREEN CLICK / TOUCH RIPPLE EFFECT */}
          {ripples.map(r => (
            <div 
              key={r.id} 
              className="click-ripple animate-touch-ripple" 
              style={{ top: r.y, left: r.x }}
            />
          ))}

          {/* Opaque Intro Splash Screen */}
          {showIntro && (
            <IntroSplash onContinue={() => setShowIntro(false)} />
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-6 inset-x-6 z-50 flex items-center justify-center pointer-events-none">
              <div className="px-5 py-2.5 rounded-full ios-liquid-glass text-[#00ff66] text-xs font-bold flex items-center gap-2 animate-bounce border border-[#00ff66]/40">
                <span className="w-2.5 h-2.5 rounded-full bg-[#00ff66] animate-ping"></span>
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {/* ========================================================
              TOP HEADER BAR
              ======================================================== */}
          <div className="w-full pt-12 px-6 pb-3 flex items-start justify-between z-20">
            <div className="flex items-center gap-3">
              <div className="flex flex-col">
                <div className="text-[10px] font-extrabold uppercase tracking-widest text-[#00ff66] font-sans">
                  {currentDevice ? (searchState === "searching" ? "FINDING" : "NEARBY") : "TRACKOVEX"}
                </div>

                <div className="flex items-center gap-1.5 mt-0.5">
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-white font-sans truncate max-w-[180px] sm:max-w-xs">
                    {currentDevice ? currentDevice.name : "No Beacon Paired"}
                  </h1>
                </div>

                {currentDevice && (
                  <div className="flex items-center gap-1.5 mt-1">
                    <div className="relative flex items-center">
                      <div className="w-5 h-2.5 rounded-[3px] border border-[#00ff66] p-[1px] flex items-center">
                        <div 
                          className={`h-full rounded-[1px] transition-all duration-500 ${
                            currentDevice.battery > 20 ? 'bg-[#00ff66]' : 'bg-[#ff453a]'
                          }`}
                          style={{ width: `${currentDevice.battery}%` }}
                        ></div>
                      </div>
                      <div className="w-[2px] h-[4px] bg-[#00ff66] rounded-r-[1px] ml-[1px]"></div>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-300 font-mono">
                      {currentDevice.battery}%
                    </span>
                    <span className="text-[9px] text-emerald-300/70 ml-1">• ESP32 UWB</span>
                  </div>
                )}
              </div>
            </div>

            {/* UPPER RADAR / ARROW TOGGLE */}
            <div className="flex items-center gap-2 pt-1">
              {currentDevice && (
                <button 
                  onClick={(e) => { e.stopPropagation(); setSearchState(prev => prev === 'searching' ? 'found' : 'searching'); }}
                  className="px-3.5 py-2 rounded-full ios-liquid-btn text-[11px] font-bold text-emerald-200 border border-[#00ff66]/40"
                >
                  {searchState === 'searching' ? "View Arrow" : "View Radar"}
                </button>
              )}

              {/* Multi-Device Pill */}
              {devices.length > 1 && (
                <button 
                  onClick={(e) => { e.stopPropagation(); setShowDeviceDrawer(true); }}
                  className="px-3 py-1.5 rounded-full ios-liquid-btn text-[11px] font-bold text-[#00ff66] flex items-center gap-1"
                >
                  <Icon name="layers" size={13} />
                  <span>{devices.length}</span>
                </button>
              )}
            </div>
          </div>

          {/* ========================================================
              CENTER CANVAS: RADAR & DIRECTION ARROW
              ======================================================== */}
          <div className="flex-1 w-full flex flex-col items-center justify-center relative px-6 z-10">
            {!currentDevice && (
              <div className="flex flex-col items-center justify-center text-center p-8">
                <div className="w-24 h-24 rounded-full ios-liquid-glass flex items-center justify-center mb-6 shadow-2xl border border-[#00ff66]">
                  <Icon name="bluetooth" size={38} className="text-[#00ff66]" />
                </div>
                <h2 className="text-xl font-extrabold text-white">No TrackoVex AirTag Found</h2>
                <p className="text-xs text-emerald-200/80 max-w-xs mt-2 leading-relaxed">
                  Power ON your Bluetooth beacon and tap the plus key on the dock to pair.
                </p>
              </div>
            )}

            {currentDevice && (
              <div className="w-full flex flex-col items-center justify-center">
                {searchState === "searching" ? (
                  <div className="flex flex-col items-center justify-center">
                    <ParticleRadarRing />
                  </div>
                ) : (
                  <div className="flex flex-col items-center justify-center">
                    <DirectionArrowView angle={arrowAngle} />
                  </div>
                )}
              </div>
            )}
          </div>

          {/* ========================================================
              BOTTOM DISTANCE & ACTIONS READOUT
              ======================================================== */}
          {currentDevice && (
            <div className="w-full px-8 pb-32 pt-2 z-20 flex flex-col justify-end">
              <div className="mb-2 select-none">
                <div className="flex items-baseline gap-2">
                  <span className="text-6xl sm:text-7xl font-extrabold tracking-tight text-white font-sans">
                    {searchState === "searching" ? "11" : distanceVal}
                  </span>
                  <span className="text-4xl sm:text-5xl font-light text-emerald-300 font-sans">
                    ft
                  </span>
                </div>

                {searchState === "found" && (
                  <div className="text-2xl sm:text-3xl font-normal text-emerald-200/90 tracking-tight mt-0.5 font-sans">
                    to your <span className="text-[#00ff66] font-bold">{directionLabel.replace("to your ", "")}</span>
                  </div>
                )}
              </div>

              {/* Disconnect & Buzzer triggers */}
              <div className="flex items-center justify-between mt-2">
                <button 
                  onClick={handleUnpair}
                  className="w-12 h-12 rounded-full ios-circle-btn flex items-center justify-center text-white hover:text-rose-400"
                  title="Disconnect Device"
                >
                  <Icon name="x" size={20} className="stroke-[2.5]" />
                </button>

                <button 
                  onClick={handleTriggerBottomBuzzer}
                  className={`w-12 h-12 rounded-full ios-circle-btn flex items-center justify-center transition-all ${
                    isBuzzerSounding ? 'ios-circle-btn-buzzer-active animate-buzzer-ping text-rose-300' : 'text-[#00ff66]'
                  }`}
                  title="Alert TrackoVex Buzzer (ESP32)"
                >
                  <Icon 
                    name={isBuzzerSounding ? "bell-ring" : "volume-2"} 
                    size={20} 
                    className={`stroke-[2.2] ${isBuzzerSounding ? 'animate-bounce text-rose-300' : ''}`} 
                  />
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              FLOATING LIQUID GLASS BOTTOM DOCK
              (Houses Add, Rename, & Settings Buttons)
              ======================================================== */}
          <div className="fixed bottom-6 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
            <div className="pointer-events-auto px-6 py-3 rounded-full liquid-dock flex items-center gap-6 sm:gap-8 shadow-2xl animate-dock-bounce border border-white/50">
              
              {/* 1. ADD BUTTON */}
              <button 
                onClick={(e) => { e.stopPropagation(); startBLEScan(); }}
                className="flex flex-col items-center gap-1 group"
              >
                <div className="w-12 h-12 rounded-full ios-liquid-btn flex items-center justify-center text-white group-hover:text-[#00ff66]">
                  <Icon name="plus" size={22} className="stroke-[2.5]" />
                </div>
                <span className="text-[10px] font-bold text-emerald-200 group-hover:text-[#00ff66]">Add</span>
              </button>

              {/* 2. RENAME BUTTON */}
              <button 
                onClick={(e) => { e.stopPropagation(); openRename(currentDevice); }}
                className="flex flex-col items-center gap-1 group"
              >
                <div className="w-12 h-12 rounded-full ios-liquid-btn flex items-center justify-center text-white group-hover:text-[#00ff66]">
                  <Icon name="edit-3" size={20} className="stroke-[2.2]" />
                </div>
                <span className="text-[10px] font-bold text-emerald-200 group-hover:text-[#00ff66]">Rename</span>
              </button>

              {/* 3. SETTINGS BUTTON */}
              <button 
                onClick={(e) => { e.stopPropagation(); setShowSettingsModal(true); }}
                className="flex flex-col items-center gap-1 group"
              >
                <div className="w-12 h-12 rounded-full ios-liquid-btn flex items-center justify-center text-white group-hover:text-[#00ff66]">
                  <Icon name="settings" size={20} className="stroke-[2.2]" />
                </div>
                <span className="text-[10px] font-bold text-emerald-200 group-hover:text-[#00ff66]">Settings</span>
              </button>

            </div>
          </div>

          {/* ========================================================
              APPLE iOS-STYLE SETTINGS INTERFACE (NO GRIDS)
              ======================================================== */}
          {showSettingsModal && (
            <div 
              onClick={(e) => { e.stopPropagation(); setShowSettingsModal(false); }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/80 backdrop-blur-2xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] ios-liquid-glass p-6 shadow-2xl space-y-5 border border-white/40 max-h-[85vh] overflow-y-auto"
              >
                {/* Modal Title Bar */}
                <div className="flex items-center justify-between pb-2 border-b border-white/20">
                  <h2 className="text-xl font-extrabold text-white tracking-tight">Settings</h2>
                  <button 
                    onClick={() => setShowSettingsModal(false)}
                    className="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {/* APPLE GROUPED LIST ITEM 1: ABOUT PAGE */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2">About Page</div>
                  <div className="apple-settings-card p-4 space-y-2">
                    <div className="flex items-center gap-3">
                      <div className="w-9 h-9 rounded-xl bg-[#00ff66] text-black flex items-center justify-center font-bold">
                        <Icon name="info" size={18} />
                      </div>
                      <div>
                        <div className="text-sm font-bold text-white">{APP_SETTINGS.aboutTitle}</div>
                        <div className="text-[11px] text-emerald-300 font-medium">Official Release</div>
                      </div>
                    </div>
                    <p className="text-xs text-emerald-100/80 leading-relaxed pt-1">
                      {APP_SETTINGS.aboutDescription}
                    </p>
                  </div>
                </div>

                {/* APPLE GROUPED LIST ITEM 2: SYSTEM DETAILS */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2">System Details</div>
                  <div className="apple-settings-card divide-y divide-white/10">
                    
                    {/* Version */}
                    <div className="p-3.5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-7 h-7 rounded-lg bg-blue-500/30 text-blue-400 flex items-center justify-center">
                          <Icon name="cpu" size={15} />
                        </div>
                        <span className="text-xs font-semibold text-white">Version Number</span>
                      </div>
                      <span className="text-xs font-mono font-bold text-[#00ff66] bg-[#00ff66]/20 px-2.5 py-1 rounded-full border border-[#00ff66]/30">
                        {APP_SETTINGS.version}
                      </span>
                    </div>

                    {/* Build */}
                    <div className="p-3.5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-7 h-7 rounded-lg bg-purple-500/30 text-purple-300 flex items-center justify-center">
                          <Icon name="code" size={15} />
                        </div>
                        <span className="text-xs font-semibold text-white">Build</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-200">{APP_SETTINGS.buildNumber}</span>
                    </div>

                    {/* Hardware */}
                    <div className="p-3.5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-7 h-7 rounded-lg bg-emerald-500/30 text-[#00ff66] flex items-center justify-center">
                          <Icon name="radio" size={15} />
                        </div>
                        <span className="text-xs font-semibold text-white">Hardware Protocol</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-200">{APP_SETTINGS.hardwareVersion}</span>
                    </div>

                  </div>
                </div>

                {/* APPLE GROUPED LIST ITEM 3: DEVELOPER INFO */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-emerald-300 px-2">Developer Information</div>
                  <div className="apple-settings-card divide-y divide-white/10">
                    
                    <div className="p-3.5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-7 h-7 rounded-lg bg-amber-500/30 text-amber-300 flex items-center justify-center">
                          <Icon name="user" size={15} />
                        </div>
                        <span className="text-xs font-semibold text-white">Developer</span>
                      </div>
                      <span className="text-xs font-bold text-white">{APP_SETTINGS.developer}</span>
                    </div>

                    <div className="p-3.5 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-7 h-7 rounded-lg bg-rose-500/30 text-rose-300 flex items-center justify-center">
                          <Icon name="mail" size={15} />
                        </div>
                        <span className="text-xs font-semibold text-white">Support Email</span>
                      </div>
                      <span className="text-xs font-mono text-emerald-300">{APP_SETTINGS.contactEmail}</span>
                    </div>

                  </div>
                </div>

                <button 
                  onClick={() => setShowSettingsModal(false)}
                  className="w-full py-3.5 rounded-2xl bg-[#00ff66] text-black text-xs font-extrabold shadow-lg active:scale-95 transition-all mt-2"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              DRAWER: MULTI-DEVICE SWITCHER
              ======================================================== */}
          {showDeviceDrawer && (
            <div 
              onClick={(e) => { e.stopPropagation(); setShowDeviceDrawer(false); }}
              className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/80 backdrop-blur-xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] ios-liquid-glass p-6 shadow-2xl space-y-4 border border-[#00ff66]/40"
              >
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h3 className="text-lg font-extrabold text-white">Active TrackoVex Devices</h3>
                    <p className="text-xs text-emerald-300/70">Switch focus between connected beacons</p>
                  </div>
                  <button onClick={() => setShowDeviceDrawer(false)} className="p-1 text-emerald-300 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                <div className="space-y-2.5 max-h-60 overflow-y-auto">
                  {devices.map(dev => {
                    const isActive = dev.id === currentDevice?.id;
                    return (
                      <div 
                        key={dev.id}
                        onClick={() => {
                          setActiveDeviceId(dev.id);
                          setShowDeviceDrawer(false);
                          notify(`Switched focus to ${dev.name}`);
                        }}
                        className={`p-3.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all border ${
                          isActive 
                            ? 'bg-[#00ff66]/20 border-[#00ff66] shadow-md' 
                            : 'bg-white/5 border-white/10 hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${
                            isActive ? 'bg-[#00ff66] text-black' : 'bg-white/10 text-neutral-300'
                          }`}>
                            <Icon name="radio" size={18} />
                          </div>
                          <div>
                            <div className="text-sm font-bold text-white flex items-center gap-2">
                              <span>{dev.name}</span>
                              {isActive && <span className="w-2 h-2 rounded-full bg-[#00ff66]"></span>}
                            </div>
                            <div className="text-[11px] text-emerald-300/80 font-mono">Battery: {dev.battery}%</div>
                          </div>
                        </div>

                        <div className="text-right">
                          <span className={`text-xs font-semibold ${isActive ? 'text-[#00ff66]' : 'text-neutral-400'}`}>
                            {isActive ? "Active" : "Select"}
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <button 
                  onClick={() => {
                    setShowDeviceDrawer(false);
                    startBLEScan();
                  }}
                  className="w-full py-3.5 rounded-2xl bg-[#00ff66] text-black text-xs font-extrabold shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="plus" size={16} />
                  <span>Pair Another TrackoVex</span>
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: RENAME DEVICE
              ======================================================== */}
          {isRenaming && (
            <div 
              onClick={(e) => { e.stopPropagation(); setIsRenaming(false); }}
              className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/80 backdrop-blur-xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-sm rounded-[32px] ios-liquid-glass p-7 shadow-2xl space-y-4 border border-[#00ff66]/40"
              >
                <div className="text-center">
                  <h3 className="text-xl font-extrabold text-white">Rename TrackoVex</h3>
                  <p className="text-xs text-emerald-200/80 mt-1">Customize device label</p>
                </div>

                <div>
                  <input 
                    type="text"
                    value={renameInput}
                    onChange={(e) => setRenameInput(e.target.value)}
                    placeholder="e.g. Camera, Keys, Wallet"
                    autoFocus
                    className="w-full px-4 py-3.5 rounded-2xl bg-[#00ff66]/10 border border-[#00ff66]/40 text-white text-base font-semibold focus:outline-none focus:ring-2 focus:ring-[#00ff66]"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => setIsRenaming(false)}
                    className="py-3 rounded-2xl bg-white/10 text-white text-xs font-bold hover:bg-white/20"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveRename}
                    className="py-3 rounded-2xl bg-[#00ff66] text-black text-xs font-extrabold shadow-lg active:scale-95 transition-all"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: ESP32 BLUETOOTH PAIRING
              ======================================================== */}
          {isScanningBLE && (
            <div 
              onClick={(e) => { e.stopPropagation(); setIsScanningBLE(false); }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/80 backdrop-blur-xl animate-fade-in"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className="w-full sm:max-w-sm rounded-t-[36px] sm:rounded-[36px] ios-liquid-glass p-7 shadow-2xl space-y-5 border border-[#00ff66]/40"
              >
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="bluetooth" size={22} className="text-[#00ff66]" />
                    <h3 className="text-lg font-extrabold text-white">Pair TrackoVex BLE</h3>
                  </div>
                  <button onClick={() => setIsScanningBLE(false)} className="p-1 text-emerald-300 hover:text-white">
                    <Icon name="x" size={20} />
                  </button>
                </div>

                {bleStatus === "scanning" && (
                  <div className="py-8 flex flex-col items-center text-center">
                    <div className="w-16 h-16 rounded-full bg-[#00ff66]/20 text-[#00ff66] flex items-center justify-center mb-3 animate-spin">
                      <Icon name="radio" size={30} />
                    </div>
                    <p className="text-sm font-bold text-white">Listening for Bluetooth Signals...</p>
                    <p className="text-xs text-emerald-200/80 mt-1">Ensure your TrackoVex is nearby</p>
                  </div>
                )}

                {bleStatus === "discovered" && discoveredESP && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl bg-[#00ff66]/10 border border-[#00ff66]/30 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-[#00ff66] text-black flex items-center justify-center">
                          <Icon name="cpu" size={20} />
                        </div>
                        <div>
                          <div className="text-sm font-bold text-white">{discoveredESP.rawName}</div>
                          <div className="text-[11px] text-emerald-300 font-mono">Battery: {discoveredESP.battery}%</div>
                        </div>
                      </div>
                      <span className="text-xs font-mono font-bold text-[#00ff66]">{discoveredESP.rssi}</span>
                    </div>

                    <button 
                      onClick={confirmPairDevice}
                      className="w-full py-4 rounded-2xl bg-[#00ff66] text-black text-xs font-extrabold shadow-xl active:scale-95 transition-all"
                    >
                      Connect & Begin Tracking
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
