<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TrackoVex - A Simple Solution</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'sans-serif'],
          },
          colors: {
            ios: {
              green: '#15c059',
              gray: '#8e8e93',
              lightGray: '#f2f2f7'
            }
          },
          animation: {
            'float-tag': 'floatTag 2s infinite ease-in-out',
            'dock-bounce': 'dockBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'check-draw': 'checkDraw 0.4s ease-out forwards',
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            floatTag: {
              '0%, 100%': { transform: 'translateY(0px) translateX(0px)' },
              '50%': { transform: 'translateY(-15px) translateX(-10px)' }
            },
            dockBounce: {
              '0%': { transform: 'scale(0.85) translateY(20px)', opacity: '0' },
              '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
            },
            checkDraw: {
              '0%': { strokeDasharray: '0, 100' },
              '100%': { strokeDasharray: '100, 100' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            },
            slideUp: {
              '0%': { transform: 'translateY(100%)' },
              '100%': { transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, Babel, Lucide Icons -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Web Audio ESP32 Buzzer Sound Synthesizer -->
  <script>
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        [0.0, 0.16, 0.32, 0.48].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2730, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.42, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio autoplay blocked:", e);
      }
    };
  </script>

  <style>
    /* Global White Theme */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #000000;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* HIGH-GLOSS LIQUID GLASS STYLING */
    .ios-liquid-glass {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-top: 1.5px solid rgba(255, 255, 255, 1);
      box-shadow: 
        0 20px 40px -10px rgba(0, 0, 0, 0.1),
        0 0 20px rgba(0, 0, 0, 0.03),
        inset 0 1px 3px rgba(255, 255, 255, 0.9);
    }

    .liquid-dock {
      background: rgba(240, 240, 245, 0.7);
      backdrop-filter: blur(45px) saturate(200%);
      -webkit-backdrop-filter: blur(45px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-top: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.1),
        inset 0 1.5px 2px rgba(255, 255, 255, 0.9);
    }

    .apple-settings-card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Morphing Continue Button */
    .btn-morph-container {
      position: relative;
      height: 56px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .btn-morph {
      background: #f2f2f7;
      color: #000;
      border-radius: 28px;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 17px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      cursor: pointer;
    }
    .btn-morph.loading {
      width: 56px;
      color: transparent;
    }
    .btn-morph.loading::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      background: #000;
      border-radius: 50%;
    }
    .btn-morph.success {
      width: 56px;
      background: #f2f2f7;
    }
    .check-icon {
      position: absolute;
      width: 24px;
      height: 24px;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-morph.success .check-icon {
      opacity: 1;
      transform: scale(1);
    }
    .check-path {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
    }
    .btn-morph.success .check-path {
      animation: checkDraw 0.4s 0.2s ease-out forwards;
    }

    /* iOS Loading Spinner */
    .ios-spinner {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top: 3px solid #000000;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const APP_SETTINGS = {
      appName: "TrackoVex",
      version: "v3.0 Liquid",
      buildNumber: "2026.10.12",
      aboutTitle: "TrackoVex Precision Beacon",
      aboutDescription: "TrackoVex provides real-time Ultra-Wideband & BLE device location tracking with hardware ESP32 buzzer triggers. Developed to ensure you never lose track of your most valuable items.",
      developer: "MiniProject III Team",
      contactEmail: "support@trackovex.io",
      hardwareVersion: "ESP32-S3 Ultra-wideband 5.0"
    };

    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, size, className]);
      return <span ref={iconRef} className={`inline-flex items-center justify-center align-middle ${className}`} style={{ width: size, height: size }}></span>;
    };

    // ==========================================
    // INTRO SPLASH
    // ==========================================
    function IntroSplash({ onContinue }) {
      const [btnState, setBtnState] = useState('idle');

      const handleProceed = () => {
        if (btnState !== 'idle') return;
        setBtnState('loading');
        
        setTimeout(() => {
          setBtnState('success');
          setTimeout(() => {
            onContinue();
          }, 800);
        }, 1000);
      };

      return (
        <div className="fixed inset-0 z-50 bg-white flex flex-col justify-between px-8 py-14 transition-opacity duration-500 select-none">
          <div className="flex-1 flex flex-col items-center justify-center">
            <img src="logo_black.png" alt="TrackoVex" className="w-32 h-auto object-contain mb-8 opacity-80" onError={(e) => e.target.style.display='none'} />
            <div className="text-center px-4 max-w-xs">
              <h1 className="text-3xl font-bold text-black tracking-tight leading-snug">
                TrackoVex
              </h1>
              <p className="text-sm text-gray-500 mt-2">
                Precision Finding
              </p>
            </div>
          </div>

          <div className="w-full flex justify-center pb-8">
            <div className="w-full max-w-sm btn-morph-container" onClick={handleProceed}>
              <div className={`btn-morph ${btnState}`}>
                {btnState === 'idle' && <span>Continue &rarr;</span>}
                <svg className="check-icon" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <polyline className="check-path" points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // DIRECTION ARROW VIEW
    // ==========================================
    function DirectionArrowView({ angle = 45 }) {
      return (
        <div className="relative flex flex-col items-center justify-center my-6">
          <div className="relative w-64 h-64 flex items-center justify-center">
            <div 
              className="relative transition-transform duration-500 ease-out"
              style={{ transform: `rotate(${angle}deg)` }}
            >
              <svg width="160" height="160" viewBox="0 0 100 100" fill="none">
                <path 
                  d="M 28,72 L 68,32 M 68,32 L 38,32 M 68,32 L 68,62" 
                  stroke="white" 
                  strokeWidth="14" 
                  strokeLinecap="round" 
                  strokeLinejoin="round" 
                  className="drop-shadow-lg"
                />
              </svg>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function TrackoVexApp() {
      const [showIntro, setShowIntro] = useState(true);
      const [devices, setDevices] = useState([]);
      const [activeDeviceId, setActiveDeviceId] = useState(null);

      const [distanceVal, setDistanceVal] = useState(7);
      const [directionLabel, setDirectionLabel] = useState("to your right");
      const [arrowAngle, setArrowAngle] = useState(0);

      const [isBuzzerSounding, setIsBuzzerSounding] = useState(false);
      
      // Pairing Flow States
      const [pairingStep, setPairingStep] = useState('idle'); // idle, searching, connecting, done
      
      // Modal States
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [showRenameModal, setShowRenameModal] = useState(false);
      const [renameInput, setRenameInput] = useState("");

      const currentDevice = useMemo(() => {
        return devices.find(d => d.id === activeDeviceId) || devices[0] || null;
      }, [devices, activeDeviceId]);

      const handleTriggerBottomBuzzer = () => {
        setIsBuzzerSounding(true);
        window.triggerESP32BuzzerAlarm();
        setTimeout(() => setIsBuzzerSounding(false), 2200);
      };

      // Simulated Tracking Updates
      useEffect(() => {
        if (!currentDevice) return;
        const interval = setInterval(() => {
          setDistanceVal(prev => {
            const delta = (Math.random() * 2 - 1);
            return Math.max(1, Math.round(prev + delta));
          });
          setArrowAngle(prev => (prev + (Math.random() * 10 - 5)));
        }, 1600);
        return () => clearInterval(interval);
      }, [currentDevice]);

      // Video-referenced Pairing Flow
      const startPairingFlow = () => {
        setPairingStep('searching');
        setTimeout(() => {
          setPairingStep('connecting');
          setTimeout(() => {
            setPairingStep('done');
          }, 3000);
        }, 4000); 
      };

      const finishPairing = () => {
        const newDevice = {
          id: `ESP32-${Date.now()}`,
          name: "TrackoVex Tag",
          battery: 100,
        };
        setDevices(prev => [...prev, newDevice]);
        setActiveDeviceId(newDevice.id);
        setPairingStep('idle');
        setDistanceVal(6);
      };

      // Rename Logic
      const openRename = () => {
        if (!currentDevice) return;
        setRenameInput(currentDevice.name);
        setShowRenameModal(true);
      };

      const saveRename = () => {
        if (!renameInput.trim() || !currentDevice) return;
        setDevices(prev => prev.map(d => d.id === currentDevice.id ? { ...d, name: renameInput.trim() } : d));
        setShowRenameModal(false);
      };

      const isFinding = !!currentDevice;
      const bgClass = isFinding ? "bg-ios-green transition-colors duration-1000" : "bg-white transition-colors duration-1000";
      const textColor = isFinding ? "text-white" : "text-black";
      const subTextColor = isFinding ? "text-white/80" : "text-gray-500";

      return (
        <div className={`relative w-screen h-screen flex flex-col overflow-hidden select-none font-sans ${bgClass}`}>
          
          {showIntro && (
            <IntroSplash onContinue={() => setShowIntro(false)} />
          )}

          {/* TOP HEADER BAR */}
          <div className="w-full pt-14 px-6 pb-3 flex items-start justify-between z-20">
            <div className="flex flex-col">
              <div className={`text-[11px] font-bold uppercase tracking-wider ${subTextColor}`}>
                {currentDevice ? "FINDING" : "TRACKOVEX"}
              </div>
              <h1 className={`text-3xl font-bold tracking-tight ${textColor} mt-1`}>
                {currentDevice ? currentDevice.name : "No Device"}
              </h1>
            </div>
          </div>

          {/* CENTER CANVAS */}
          <div className="flex-1 w-full flex flex-col items-center justify-center relative px-6 z-10">
            {!currentDevice && (
              <div className="flex flex-col items-center justify-center text-center p-8">
                <div className="w-24 h-24 rounded-full ios-liquid-glass flex items-center justify-center mb-6">
                  <Icon name="bluetooth" size={32} className="text-black/40" />
                </div>
                <h2 className="text-xl font-bold text-black">No Item Selected</h2>
                <p className="text-sm text-gray-500 mt-2">Tap the add button to pair a TrackoVex.</p>
              </div>
            )}

            {currentDevice && (
              <div className="w-full flex flex-col items-center justify-center">
                <DirectionArrowView angle={arrowAngle} />
              </div>
            )}
          </div>

          {/* BOTTOM DISTANCE READOUT */}
          {currentDevice && (
            <div className="w-full px-8 pb-36 pt-2 z-20 flex flex-col justify-end">
              <div className="mb-4">
                <div className="flex items-baseline gap-2">
                  <span className={`text-7xl font-bold tracking-tight ${textColor}`}>
                    {distanceVal}
                  </span>
                  <span className={`text-4xl font-normal ${subTextColor}`}>ft</span>
                </div>
                <div className={`text-2xl font-normal ${subTextColor} mt-1`}>
                  {directionLabel}
                </div>
              </div>

              <div className="flex items-center justify-between">
                <button 
                  onClick={() => {
                    setDevices(devices.filter(d => d.id !== currentDevice.id));
                    setActiveDeviceId(null);
                  }}
                  className={`w-14 h-14 rounded-full flex items-center justify-center backdrop-blur-xl border ${isFinding ? 'bg-white/20 border-white/30 text-white' : 'bg-gray-100 border-gray-200 text-black'}`}
                >
                  <Icon name="x" size={24} />
                </button>

                <button 
                  onClick={handleTriggerBottomBuzzer}
                  className={`w-14 h-14 rounded-full flex items-center justify-center backdrop-blur-xl border transition-all ${
                    isBuzzerSounding 
                      ? (isFinding ? 'bg-white text-ios-green' : 'bg-ios-green text-white') 
                      : (isFinding ? 'bg-white/20 border-white/30 text-white' : 'bg-gray-100 border-gray-200 text-black')
                  }`}
                >
                  <Icon name={isBuzzerSounding ? "bell-ring" : "volume-2"} size={24} />
                </button>
              </div>
            </div>
          )}

          {/* FLOATING LIQUID GLASS DOCK */}
          <div className="fixed bottom-8 inset-x-0 z-40 flex justify-center px-4 pointer-events-none">
            <div className="pointer-events-auto px-8 py-4 rounded-[2rem] liquid-dock flex items-center gap-10 shadow-xl animate-dock-bounce">
              
              <button onClick={() => startPairingFlow()} className="flex flex-col items-center gap-1.5 group">
                <Icon name="plus" size={24} className="text-black/70 group-hover:text-black transition-colors" />
                <span className="text-[10px] font-semibold text-black/60 group-hover:text-black">Add</span>
              </button>

              <button onClick={openRename} className={`flex flex-col items-center gap-1.5 group ${!currentDevice && 'opacity-40 pointer-events-none'}`}>
                <Icon name="edit-2" size={22} className="text-black/70 group-hover:text-black transition-colors" />
                <span className="text-[10px] font-semibold text-black/60 group-hover:text-black">Rename</span>
              </button>

              <button onClick={() => setShowSettingsModal(true)} className="flex flex-col items-center gap-1.5 group">
                <Icon name="settings" size={24} className="text-black/70 group-hover:text-black transition-colors" />
                <span className="text-[10px] font-semibold text-black/60 group-hover:text-black">Settings</span>
              </button>

            </div>
          </div>

          {/* ==========================================
              PAIRING & CONNECTION FLOW (Video 1 & 2)
              ========================================== */}
          {pairingStep !== 'idle' && (
            <div className="fixed inset-0 z-50 bg-white flex flex-col justify-end animate-fade-in">
              <div className="w-full h-[65vh] bg-white rounded-t-[2.5rem] shadow-[0_-20px_50px_rgba(0,0,0,0.08)] flex flex-col items-center p-8 relative animate-slide-up">
                
                {pairingStep === 'searching' && (
                  <div className="flex flex-col items-center w-full mt-4">
                    <h2 className="text-[22px] font-bold text-black mb-2 tracking-tight">Searching for AirTag...</h2>
                    <p className="text-[15px] text-gray-500 text-center mb-16 max-w-xs">Pull tab on AirTag and bring it near this iPhone to start.</p>
                    
                    <div className="relative w-64 h-64 flex items-center justify-center">
                      {/* Phone silhouette */}
                      <div className="absolute w-28 h-[13.5rem] border-[4px] border-gray-300 rounded-[2.5rem] z-10 flex flex-col items-center">
                        <div className="w-10 h-[5px] bg-gray-300 rounded-b-xl"></div>
                      </div>
                      {/* Floating Tag */}
                      <div className="absolute left-6 top-1/2 w-12 h-12 bg-gray-100 border border-gray-200 rounded-full shadow-lg z-20 animate-float-tag"></div>
                    </div>
                  </div>
                )}

                {pairingStep === 'connecting' && (
                  <div className="flex flex-col items-center justify-center w-full h-full mt-[-2rem]">
                    <div className="ios-spinner mb-6"></div>
                    <h2 className="text-[22px] font-bold text-black tracking-tight">setting things up</h2>
                  </div>
                )}

                {pairingStep === 'done' && (
                  <div className="flex flex-col items-start w-full h-full justify-end pb-4">
                    <div className="flex-1 flex flex-col justify-center w-full">
                      <h2 className="text-3xl font-bold text-black mb-2 tracking-tight">all done!</h2>
                      <p className="text-[15px] text-gray-500">tap start tracking on the main screen to start your first tracking session</p>
                    </div>
                    <button 
                      onClick={finishPairing}
                      className="w-full py-[1.1rem] bg-ios-lightGray text-black rounded-2xl font-bold text-[17px] active:scale-95 transition-transform"
                    >
                      okay
                    </button>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* ==========================================
              RENAME MODAL
              ========================================== */}
          {showRenameModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/40 backdrop-blur-sm animate-fade-in" onClick={() => setShowRenameModal(false)}>
              <div className="w-full max-w-sm rounded-[24px] bg-white p-6 shadow-2xl" onClick={e => e.stopPropagation()}>
                <h3 className="text-xl font-bold text-black text-center mb-4">Rename Item</h3>
                <input 
                  type="text"
                  value={renameInput}
                  onChange={(e) => setRenameInput(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl bg-gray-100 border-none text-black font-medium focus:outline-none focus:ring-2 focus:ring-ios-green mb-5"
                  placeholder="e.g. Wallet, Keys"
                  autoFocus
                />
                <div className="flex gap-3">
                  <button onClick={() => setShowRenameModal(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-black font-semibold">Cancel</button>
                  <button onClick={saveRename} className="flex-1 py-3 rounded-xl bg-black text-white font-semibold">Save</button>
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              SETTINGS MODAL
              ========================================== */}
          {showSettingsModal && (
            <div onClick={() => setShowSettingsModal(false)} className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/40 backdrop-blur-sm animate-fade-in">
              <div onClick={(e) => e.stopPropagation()} className="w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] bg-ios-lightGray p-6 shadow-2xl space-y-6 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-2">
                  <h2 className="text-2xl font-bold text-black tracking-tight">Settings</h2>
                  <button onClick={() => setShowSettingsModal(false)} className="w-8 h-8 rounded-full bg-gray-200/80 text-gray-600 flex items-center justify-center font-bold active:bg-gray-300">
                    <Icon name="x" size={18} />
                  </button>
                </div>
                
                {/* About Section */}
                <div className="space-y-1.5">
                  <div className="text-[12px] font-semibold text-gray-500 uppercase tracking-wider px-4">About</div>
                  <div className="apple-settings-card divide-y divide-gray-100">
                    <div className="p-4">
                      <h3 className="text-[17px] font-semibold text-black mb-1">{APP_SETTINGS.aboutTitle}</h3>
                      <p className="text-[15px] text-gray-500 leading-snug">{APP_SETTINGS.aboutDescription}</p>
                    </div>
                  </div>
                </div>

                {/* Support Section */}
                <div className="space-y-1.5">
                  <div className="text-[12px] font-semibold text-gray-500 uppercase tracking-wider px-4">Support</div>
                  <div className="apple-settings-card divide-y divide-gray-100">
                    <div className="p-4 flex justify-between items-center">
                      <span className="text-[17px] text-black">Customer Support</span>
                      <span className="text-[17px] text-gray-500">24/7 Available</span>
                    </div>
                    <div className="p-4 flex justify-between items-center">
                      <span className="text-[17px] text-black">Support Mail</span>
                      <span className="text-[17px] text-blue-500">{APP_SETTINGS.contactEmail}</span>
                    </div>
                  </div>
                </div>

                {/* App Info Section */}
                <div className="space-y-1.5">
                  <div className="text-[12px] font-semibold text-gray-500 uppercase tracking-wider px-4">App Info</div>
                  <div className="apple-settings-card divide-y divide-gray-100">
                    <div className="p-4 flex justify-between items-center">
                      <span className="text-[17px] text-black">Version</span>
                      <span className="text-[17px] text-gray-500">{APP_SETTINGS.version}</span>
                    </div>
                    <div className="p-4 flex justify-between items-center">
                      <span className="text-[17px] text-black">Developer</span>
                      <span className="text-[17px] text-gray-500">{APP_SETTINGS.developer}</span>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
