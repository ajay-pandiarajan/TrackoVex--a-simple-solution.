  <!-- Web Audio ESP32 Buzzer Sound Synthesizer -->
  <script>
    window.triggerESP32BuzzerAlarm = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        [0.0, 0.16, 0.32, 0.48].forEach(offset => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(2600, now + offset);
          gain.gain.setValueAtTime(0, now + offset);
          gain.gain.linearRampToValueAtTime(0.35, now + offset + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.14);
        });
      } catch (e) {
        console.warn("Audio blocked:", e);
      }
    };

    window.playGentleTap = function() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(640, now);
        osc.frequency.exponentialRampToValueAtTime(360, now + 0.07);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch(e) {}
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ========================================================
    // ⚙️ EDITABLE SETTINGS VALUES IN HTML SCRIPT
    // ========================================================
    const APP_CONFIG = {
      appName: "TrackoVex",
      tagline: "A Simple Solution",
      version: "v3.4 Liquid Glass",
      buildNumber: "2026.10.12",
      supportEmail: "support@trackovex.io",

    // --- Lucide Icon Helper ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (window.lucide && iconRef.current) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width:${size}px; height:${size}px;"></i>`;

    // ========================================================
    // 1. INTRO SPLASH SCREEN
    // ========================================================
    function IntroSplash({ onContinue, theme }) {
      const [step, setStep] = useState(1);
      const [animatingOut, setAnimatingOut] = useState(false);

      const handleProceed = () => {
        window.playGentleTap();
        if (step === 1) {
          setStep(2);
        } else {
          setAnimatingOut(true);
          setTimeout(() => {
            onContinue();
          }, 500);
        }
      };

      const isLight = theme === 'light';

      return (
        <div className={`fixed inset-0 z-50 ${isLight ? 'bg-sky-50/95 text-slate-900' : 'bg-[#030a16]/95 text-white'} backdrop-blur-2xl flex flex-col justify-between px-8 py-14 transition-all duration-500 select-none ${
          animatingOut ? 'opacity-0 scale-105 filter blur-sm pointer-events-none' : 'opacity-100 scale-100'
        }`}>
          {/* Step Indicator */}
          <div className="flex justify-center pt-2">
            <div className="flex gap-2">
              <span className={`h-1.5 rounded-full transition-all duration-300 ${step === 1 ? 'w-6 bg-[#38bdf8]' : 'w-1.5 bg-white/30'}`}></span>

            <div className="relative animate-float-disc flex items-center justify-center mb-8">
              <div className="w-52 h-52 rounded-full p-2.5 apple-bluetooth-orb flex items-center justify-center">
                <div className={`w-full h-full rounded-full ${isLight ? 'bg-gradient-to-tr from-white via-sky-100 to-sky-300/40' : 'bg-gradient-to-tr from-white/95 via-sky-100 to-[#0284c7]/40'} shadow-[inset_0_3px_6px_rgba(255,255,255,0.9),inset_0_-4px_8px_rgba(0,0,0,0.3)] flex items-center justify-center p-6 relative overflow-hidden`}>
                  <div className="absolute inset-1.5 rounded-full border border-sky-400/40 pointer-events-none"></div>

                    src="logo_black.png" 
                    onError={(e) => {
                      e.target.onerror = null;
                      e.target.src = "logo.png";
                    }}
                    alt="TrackoVex" 
                    className="w-28 h-auto object-contain filter contrast-125 drop-shadow-[0_2px_8px_rgba(0,0,0,0.25)]"

              </div>
            </div>

            <div className="text-center px-4 max-w-xs">
              <h1 className={`text-3xl font-extrabold tracking-tight leading-snug ${isLight ? 'text-slate-900' : 'text-white'}`}>
                {step === 1 ? "Lose your knack for losing things." : "MiniProject III."}

              <p className={`text-xs mt-2 font-medium tracking-wide ${isLight ? 'text-sky-700' : 'text-sky-200/80'}`}>
                TrackoVex • {APP_CONFIG.tagline}

          {/* CONTINUE BUTTON */}
          <div className="w-full flex justify-center pb-2">
            <button

              <span>Continue</span>
              <Icon name="chevron-right" size={18} className="stroke-[2.5] transition-transform group-hover:translate-x-0.5" />

          </div>

    }

    // ==========================================
    // 2. CANVAS RADAR RING (LIGHT BLUE)
    // ==========================================
    function ParticleRadarRing({ theme }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const size = Math.min(window.innerWidth * 0.85, 330);
        canvas.width = size;
        canvas.height = size;

        const centerX = size / 2;
        const centerY = size / 2;
        const baseRadius = size * 0.38;

        const particleCount = 110;
        const particles = Array.from({ length: particleCount }).map(() => ({
          angle: Math.random() * Math.PI * 2,
          radiusOffset: (Math.random() - 0.5) * 40,
          speed: 0.005 + Math.random() * 0.010,
          baseSize: 1.6 + Math.random() * 2.4,
          alpha: 0.25 + Math.random() * 0.75,
          pulseSpeed: 0.02 + Math.random() * 0.03
        }));

        const render = () => {
          ctx.clearRect(0, 0, size, size);

          // Minimal glass rings
          [0.38, 0.7, 1.0].forEach((scale, i) => {
            ctx.beginPath();
            ctx.arc(centerX, centerY, baseRadius * scale, 0, Math.PI * 2);
            ctx.strokeStyle = i === 2 
              ? (theme === 'light' ? 'rgba(2, 132, 199, 0.45)' : 'rgba(56, 189, 248, 0.45)')
              : (theme === 'light' ? 'rgba(14, 165, 233, 0.18)' : 'rgba(255, 255, 255, 0.14)');
            ctx.lineWidth = 1;
            ctx.stroke();
          });

          // Soft particles in Light Blue
          particles.forEach(p => {
            p.angle += p.speed;
            p.alpha += Math.sin(Date.now() * 0.003 * p.pulseSpeed) * 0.015;
            const currentAlpha = Math.max(0.18, Math.min(0.85, p.alpha));

            const currentR = baseRadius + p.radiusOffset + Math.sin(p.angle * 3) * 5;
            const x = centerX + Math.cos(p.angle) * currentR;
            const y = centerY + Math.sin(p.angle) * currentR;

            ctx.beginPath();
            ctx.arc(x, y, p.baseSize, 0, Math.PI * 2);
            ctx.fillStyle = theme === 'light' 
              ? `rgba(2, 132, 199, ${currentAlpha})`
              : `rgba(56, 189, 248, ${currentAlpha})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#38bdf8";
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, [theme]);

      return (
        <div className="relative flex items-center justify-center">
          <canvas ref={canvasRef} className="block select-none pointer-events-none" />
        </div>
      );
    }

    // ==========================================
    // 4. MAIN APPLICATION COMPONENT
    // ==========================================
    function TrackoVexApp() {
      // Views: 'home'
      const [currentView, setCurrentView] = useState('home');
      const [showIntro, setShowIntro] = useState(true);

      // Theme State: 'dark' | 'light'
      const [theme, setTheme] = useState('dark');

      // Sync theme class to document body
      useEffect(() => {
        if (theme === 'light') {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-light');
        } else {
          document.body.classList.remove('theme-light');
          document.body.classList.add('theme-dark');
        }
      }, [theme]);

      const toggleTheme = () => {
        window.playGentleTap();
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
        notify(`Switched to ${theme === 'dark' ? 'White / Light' : 'Dark'} Mode`);
      };

      // Devices
      const [devices, setDevices] = useState([
        {
          id: "ESP32-9021",
          name: "Car Keys",
          battery: 94,
          rawName: "ESP32_TrackoVex_1",
          rssi: "-48 dBm"
        }
      ]);
      const [activeDeviceId, setActiveDeviceId] = useState("ESP32-9021");

      // Tracking Readout
      const [searchState, setSearchState] = useState("searching");
      const [distanceVal, setDistanceVal] = useState(7);
      const [directionLabel, setDirectionLabel] = useState("to your right");
      const [arrowAngle, setArrowAngle] = useState(0);
      const [isBuzzerSounding, setIsBuzzerSounding] = useState(false);

      // BLE Scanner
      const [isScanningBLE, setIsScanningBLE] = useState(false);
      const [bleStatus, setBleStatus] = useState("idle");
      const [discoveredESP, setDiscoveredESP] = useState(null);

      // Modals & Drawers
      const [showDeviceDrawer, setShowDeviceDrawer] = useState(false);
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [isRenaming, setIsRenaming] = useState(false);
      const [renameInput, setRenameInput] = useState("");

      // Settings Feedback Form
      const [feedbackRating, setFeedbackRating] = useState(5);
      const [feedbackCategory, setFeedbackCategory] = useState("General UI");
      const [feedbackComment, setFeedbackComment] = useState("");
      const [feedbackSent, setFeedbackSent] = useState(false);

      // Preferences
      const [distanceUnit, setDistanceUnit] = useState("ft");

      // Gentle Liquid Touches (Soft light blue droplet bloom)
      const [gentleTouches, setGentleTouches] = useState([]);

      // Toast Notification
      const [toastMsg, setToastMsg] = useState(null);

      // Dock Active Option (Index: 0=Add, 1=Rename, 2=Home/Logo, 3=Devices, 4=Settings)
      const [activeDockTab, setActiveDockTab] = useState(2); // Default is Home (Center)

      const notify = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // Gentle Touch Interaction
      const handleGlobalClick = (e) => {
        const x = e.clientX;
        const y = e.clientY;
        const id = Date.now() + Math.random();
        setGentleTouches(prev => [...prev.slice(-3), { id, x, y }]);
        setTimeout(() => {
          setGentleTouches(prev => prev.filter(t => t.id !== id));
        }, 850);
      };

      const currentDevice = useMemo(() => {
        return devices.find(d => d.id === activeDeviceId) || devices[0] || null;
      }, [devices, activeDeviceId]);

      // Sound ESP32 Buzzer
      const handleTriggerBuzzer = () => {
        window.playGentleTap();
        setIsBuzzerSounding(true);
        window.triggerESP32BuzzerAlarm();
        notify(`Buzzer Sounding on ${currentDevice?.name || "TrackoVex"}!`);
        setTimeout(() => setIsBuzzerSounding(false), 2200);
      };

      // Live Tracking Interval
      useEffect(() => {
        if (!currentDevice) return;
        const interval = setInterval(() => {
          if (searchState === "found") {
            setDistanceVal(prev => {
              const delta = (Math.random() * 2 - 1);
              return Math.max(1, Math.round(prev + delta));
            });
            setArrowAngle(prev => (prev + (Math.random() * 10 - 5)));
          }
        }, 1600);
        return () => clearInterval(interval);
      }, [currentDevice, searchState]);

      // Start BLE Scan
      const startBLEScan = async () => {
        window.playGentleTap();
        setIsScanningBLE(true);
        setBleStatus("scanning");

        if (navigator.bluetooth) {
          try {
            const dev = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: ['battery_service']
            });
            if (dev) {
              setDiscoveredESP({
                id: dev.id || `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
                rawName: dev.name || `ESP32_TrackoVex_${devices.length + 1}`,
                rssi: "-48 dBm",
                battery: 98
              });
              setBleStatus("discovered");
              return;
            }
          } catch (e) {}
        }

        setTimeout(() => {
          const count = devices.length + 1;
          setDiscoveredESP({
            id: `ESP32-${Math.floor(1000 + Math.random() * 9000)}`,
            rawName: `ESP32_TrackoVex_Unit_${count}`,
            rssi: "-48 dBm",
            battery: count === 1 ? 94 : 85
          });
          setBleStatus("discovered");
        }, 1600);
      };

      const confirmPairDevice = () => {
        window.playGentleTap();
        if (!discoveredESP) return;
        const defaultNames = ["Camera", "Car Keys", "MacBook Sleeve", "Backpack"];
        const nameToUse = defaultNames[devices.length % defaultNames.length];
        
        const newDevice = {
          id: discoveredESP.id,
          name: nameToUse,
          battery: discoveredESP.battery || 100,
          rawName: discoveredESP.rawName,
          rssi: discoveredESP.rssi
        };

        const updated = [...devices, newDevice];
        setDevices(updated);
        setActiveDeviceId(newDevice.id);
        setSearchState("searching");
        setIsScanningBLE(false);
        setDiscoveredESP(null);
        setBleStatus("idle");
        setActiveDockTab(2); // Snap back to Center Home
        notify(`Paired "${newDevice.name}" successfully!`);

        setTimeout(() => {
          setSearchState("found");
          setDistanceVal(Math.floor(4 + Math.random() * 7));
          notify(`Signal locked on ${newDevice.name}!`);
        }, 2500);
      };

      const openRename = (dev) => {
        window.playGentleTap();
        if (!dev) {
          notify("No active device to rename!");
          return;
        }
        setRenameInput(dev.name);
        setIsRenaming(true);
      };

      const saveRename = () => {
        window.playGentleTap();
        if (!renameInput.trim() || !currentDevice) return;
        const clean = renameInput.trim();
        setDevices(prev => prev.map(d => d.id === currentDevice.id ? { ...d, name: clean } : d));
        setIsRenaming(false);
        setActiveDockTab(2); // Snap back to Center Home
        notify(`Renamed to "${clean}"`);
      };

      const handleUnpair = () => {
        window.playGentleTap();
        if (!currentDevice) return;
        const remaining = devices.filter(d => d.id !== currentDevice.id);
        setDevices(remaining);
        setActiveDeviceId(remaining[0]?.id || null);
        notify(`Removed "${currentDevice.name}"`);
      };

      const handleFeedbackSubmit = (e) => {
        e.preventDefault();
        window.playGentleTap();
        setFeedbackSent(true);
        notify("Thank you! Feedback received.");

      // Fallback ambient fluid canvas
      useEffect(() => {
        const canvas = document.getElementById('fallback-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        let step = 0;
        let id;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          step += 0.005;
          const grad = ctx.createRadialGradient(
            canvas.width * 0.5 + Math.sin(step) * 120,
            canvas.height * 0.35 + Math.cos(step * 0.8) * 80,
            40,
            canvas.width * 0.5,
            canvas.height * 0.5,
            canvas.width * 0.7
          );
          if (theme === 'light') {
            grad.addColorStop(0, 'rgba(186, 230, 253, 0.45)');
            grad.addColorStop(0.5, 'rgba(125, 211, 252, 0.25)');
            grad.addColorStop(1, 'rgba(224, 242, 254, 0)');
          } else {
            grad.addColorStop(0, 'rgba(56, 189, 248, 0.28)');
            grad.addColorStop(0.5, 'rgba(3, 105, 161, 0.18)');
            grad.addColorStop(1, 'rgba(2, 6, 23, 0)');
          }
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          id = requestAnimationFrame(draw);
        };
        draw();
        return () => cancelAnimationFrame(id);
      }, [theme]);

      // Contextual Dock visibility rule:
      const isDockVisible = currentView === 'home' && !isScanningBLE && !showSettingsModal && !isRenaming && !showDeviceDrawer && !showIntro;

      const isLight = theme === 'light';

      return (
        <div 
          onClick={handleGlobalClick}

        >
          {/* GENTLE LIQUID TOUCH ANIMATIONS */}

          {/* Intro Splash Screen */}

            <IntroSplash theme={theme} onContinue={() => setShowIntro(false)} />

          {/* Minimal Toast Notification */}

            <div className="fixed top-6 inset-x-6 z-50 flex items-center justify-center pointer-events-none">
              <div className={`px-5 py-2.5 rounded-full apple-glass-btn text-xs font-semibold flex items-center gap-2 shadow-xl border ${isLight ? 'border-sky-300/40 text-sky-700' : 'border-white/30 text-[#38bdf8]'}`}>
                <span className="w-2 h-2 rounded-full bg-[#38bdf8] shadow-[0_0_8px_#38bdf8]"></span>
                <span className={isLight ? 'text-slate-800' : 'text-white'}>{toastMsg}</span>

          {/* ========================================================
              TOP HEADER BAR (WITH LIGHT / DARK THEME TOGGLE)

                      </div>
                      <div className="w-[2px] h-[4px] bg-[#38bdf8] rounded-r-[1px] ml-[1px]"></div>

                    </span>

                  className={`w-12 h-12 rounded-full apple-glass-circle flex items-center justify-center transition-all ${
                    isBuzzerSounding ? 'apple-buzzer-active animate-buzzer-gentle text-rose-300' : 'text-[#38bdf8]'

                >

                  }`}>
                    <div className="w-full h-full rounded-full bg-gradient-to-tr from-white via-sky-100 to-sky-300 flex items-center justify-center overflow-hidden p-1">
                      <img 
                        src="logo_black.png" 
                        onError={(e) => {
                          e.target.onerror = null;
                          e.target.src = "logo.png";
                        }}
                        alt="Home" 
                        className="w-5 h-5 object-contain"
                      />
                    </div>
                  </div>
                  <span className={`text-[10px] font-bold mt-0.5 ${activeDockTab === 2 ? 'text-[#38bdf8]' : (isLight ? 'text-slate-700' : 'text-sky-100/90')}`}>
                    Home
                  </span>
                </button>

                {/* 4. DEVICES BUTTON */}
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    setActiveDockTab(3);
                    setShowDeviceDrawer(true); 
                  }}
                  className="flex-1 flex flex-col items-center py-2 relative z-10 transition-transform active:scale-95 group"
                >
                  <Icon name="layers" size={17} className={`stroke-[2.2] ${isLight ? 'text-slate-700 group-hover:text-[#0284c7]' : 'text-white/90 group-hover:text-[#38bdf8]'}`} />
                  <span className={`text-[10px] font-semibold mt-0.5 ${isLight ? 'text-slate-600' : 'text-sky-100/90'}`}>Beacons</span>
                </button>

                {/* 5. SETTINGS BUTTON */}
                <button 
                  onClick={(e) => { 
                    e.stopPropagation(); 
                    setActiveDockTab(4);
                    setShowSettingsModal(true); 
                  }}
                  className="flex-1 flex flex-col items-center py-2 relative z-10 transition-transform active:scale-95 group"
                >
                  <Icon name="settings" size={17} className={`stroke-[2.2] ${isLight ? 'text-slate-700 group-hover:text-[#0284c7]' : 'text-white/90 group-hover:text-[#38bdf8]'}`} />
                  <span className={`text-[10px] font-semibold mt-0.5 ${isLight ? 'text-slate-600' : 'text-sky-100/90'}`}>Settings</span>
                </button>

              </div>
            </div>
          )}

          {/* ========================================================
              SETTINGS MODAL (LIGHT BLUE LIQUID GLASS)
              ======================================================== */}
          {showSettingsModal && (
            <div 
              onClick={(e) => { 
                e.stopPropagation(); 
                setShowSettingsModal(false); 
                setActiveDockTab(2);
              }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className={`w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-6 shadow-2xl space-y-5 border max-h-[85vh] overflow-y-auto ${isLight ? 'border-sky-300/40 text-slate-900' : 'border-white/30 text-white'}`}
              >
                {/* Title Bar */}
                <div className={`flex items-center justify-between pb-2 border-b ${isLight ? 'border-sky-200/50' : 'border-white/15'}`}>
                  <h2 className="text-xl font-extrabold tracking-tight">Settings</h2>
                  <button 
                    onClick={() => {
                      setShowSettingsModal(false);
                      setActiveDockTab(2);
                    }}
                    className="w-8 h-8 rounded-full apple-glass-btn flex items-center justify-center"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {/* THEME SELECTION OPTION IN SETTINGS */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-[#38bdf8] px-2 flex items-center gap-1.5">
                    <Icon name="palette" size={13} />
                    <span>Display Theme</span>
                  </div>
                  <div className="apple-settings-card p-3.5 flex items-center justify-between">
                    <div>
                      <div className="text-xs font-semibold">Appearance Mode</div>
                      <div className="text-[11px] opacity-75">{isLight ? "White / Light Glass" : "Dark Sapphire Glass"}</div>
                    </div>
                    <div className="flex gap-1">
                      <button 
                        onClick={() => setTheme('dark')}
                        className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 ${
                          !isLight ? 'bg-[#38bdf8] text-black shadow' : 'opacity-70'
                        }`}
                      >
                        <Icon name="moon" size={12} />
                        <span>Dark</span>
                      </button>
                      <button 
                        onClick={() => setTheme('light')}
                        className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 ${
                          isLight ? 'bg-[#38bdf8] text-black shadow' : 'opacity-70'
                        }`}
                      >
                        <Icon name="sun" size={12} />
                        <span>White</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* FEATURE 1: CUSTOMER FEEDBACK */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-[#38bdf8] px-2 flex items-center gap-1.5">
                    <Icon name="message-square" size={13} />
                    <span>Customer Feedback</span>
                  </div>
                  <div className="apple-settings-card p-4 space-y-3">
                    <div className="text-xs opacity-80">
                      Share your thoughts on the liquid glass UI or ESP32 hardware:
                    </div>

                    <form onSubmit={handleFeedbackSubmit} className="space-y-3">
                      {/* Star Rating */}
                      <div className="flex items-center gap-2">
                        {[1, 2, 3, 4, 5].map((star) => (
                          <button
                            type="button"
                            key={star}
                            onClick={() => {
                              window.playGentleTap();
                              setFeedbackRating(star);
                            }}
                            className="p-1 transition-transform active:scale-90"
                          >
                            <Icon 
                              name="star" 
                              size={18} 
                              className={star <= feedbackRating ? "text-[#38bdf8] fill-[#38bdf8]" : "opacity-25"} 
                            />
                          </button>
                        ))}
                        <span className="text-xs ml-2 font-mono opacity-80">{feedbackRating} / 5 Stars</span>
                      </div>

                      {/* Category */}
                      <div>
                        <select 
                          value={feedbackCategory}
                          onChange={(e) => setFeedbackCategory(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl apple-glass-input text-xs"
                        >
                          <option value="General UI" className={isLight ? "bg-white text-slate-900" : "bg-[#030a16] text-white"}>Liquid Glass UI / UX</option>
                          <option value="ESP32 Buzzer" className={isLight ? "bg-white text-slate-900" : "bg-[#030a16] text-white"}>ESP32 Buzzer Feedback</option>
                          <option value="Tracking" className={isLight ? "bg-white text-slate-900" : "bg-[#030a16] text-white"}>Direction / Distance Radar</option>
                          <option value="Feature" className={isLight ? "bg-white text-slate-900" : "bg-[#030a16] text-white"}>Feature Request</option>
                        </select>
                      </div>

                      {/* Comment */}
                      <div>
                        <textarea 
                          rows="2"
                          value={feedbackComment}
                          onChange={(e) => setFeedbackComment(e.target.value)}
                          placeholder="Your comments..."
                          required
                          className="w-full p-2.5 rounded-xl apple-glass-input text-xs resize-none"
                        ></textarea>
                      </div>

                      <button 
                        type="submit"
                        className="w-full py-2.5 rounded-xl apple-primary-glass-btn text-white text-xs font-bold"
                      >
                        {feedbackSent ? "✓ Feedback Submitted" : "Send Customer Feedback"}
                      </button>
                    </form>
                  </div>
                </div>

                {/* FEATURE 2: SUPPORT EMAIL & HELPLINE */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-[#38bdf8] px-2 flex items-center gap-1.5">
                    <Icon name="mail" size={13} />
                    <span>Support & Contact</span>
                  </div>
                  <div className={`apple-settings-card divide-y ${isLight ? 'divide-sky-200/50' : 'divide-white/10'}`}>
                    <div className="p-3.5 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-semibold">Official Support Email</div>
                        <div className="text-[11px] font-mono text-[#38bdf8]">{APP_CONFIG.supportEmail}</div>
                      </div>
                      <a 
                        href={`mailto:${APP_CONFIG.supportEmail}?subject=TrackoVex%20Support`}
                        className="px-3 py-1.5 rounded-full apple-glass-btn text-xs font-bold text-[#38bdf8]"
                      >
                        Email
                      </a>
                    </div>

                    <div className="p-3.5 flex items-center justify-between">
                      <div>
                        <div className="text-xs font-semibold">Helpline Phone</div>
                        <div className="text-[11px] font-mono text-[#38bdf8]">{APP_CONFIG.supportPhone}</div>
                      </div>
                      <button 
                        onClick={() => {
                          navigator.clipboard?.writeText(APP_CONFIG.supportPhone);
                          notify("Phone copied!");
                        }}
                        className="px-3 py-1.5 rounded-full apple-glass-btn text-xs font-semibold"
                      >
                        Copy
                      </button>
                    </div>
                  </div>
                </div>

                {/* FEATURE 3: PREFERENCES & SYSTEM INFO */}
                <div className="space-y-1.5">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-[#38bdf8] px-2 flex items-center gap-1.5">
                    <Icon name="sliders" size={13} />
                    <span>System & Preferences</span>
                  </div>
                  <div className={`apple-settings-card divide-y ${isLight ? 'divide-sky-200/50' : 'divide-white/10'}`}>
                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold">Distance Unit</span>
                      <div className="flex gap-1">
                        <button 
                          onClick={() => setDistanceUnit('ft')}
                          className={`px-3 py-1 rounded-full text-xs font-bold transition-all ${
                            distanceUnit === 'ft' ? 'bg-[#38bdf8] text-black shadow' : 'opacity-70'
                          }`}
                        >
                          Feet (ft)
                        </button>
                        <button 
                          onClick={() => setDistanceUnit('m')}
                          className={`px-3 py-1 rounded-full text-xs font-bold transition-all ${
                            distanceUnit === 'm' ? 'bg-[#38bdf8] text-black shadow' : 'opacity-70'
                          }`}
                        >
                          Meters (m)
                        </button>
                      </div>
                    </div>

                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold">Version</span>
                      <span className="text-xs font-mono font-bold text-[#38bdf8]">{APP_CONFIG.version}</span>
                    </div>

                    <div className="p-3.5 flex items-center justify-between">
                      <span className="text-xs font-semibold">Hardware Protocol</span>
                      <span className="text-xs font-mono opacity-80">{APP_CONFIG.hardwareProtocol}</span>
                    </div>
                  </div>
                </div>

                <button 
                  onClick={() => {
                    setShowSettingsModal(false);
                    setActiveDockTab(2);
                  }}
                  className="w-full py-3.5 rounded-2xl apple-glass-btn text-xs font-bold shadow-lg transition-all mt-2"
                >
                  Done
                </button>
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: ESP32 BLUETOOTH PAIRING
              ======================================================== */}
          {isScanningBLE && (
            <div 
              onClick={(e) => { 
                e.stopPropagation(); 
                setIsScanningBLE(false); 
                setActiveDockTab(2);
              }}
              className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className={`w-full sm:max-w-sm rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-7 shadow-2xl space-y-5 border ${isLight ? 'border-sky-300/40 text-slate-900' : 'border-white/30 text-white'}`}
              >
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="bluetooth" size={20} className="text-[#38bdf8]" />
                    <h3 className="text-lg font-bold">Pair TrackoVex BLE</h3>
                  </div>
                  <button onClick={() => { setIsScanningBLE(false); setActiveDockTab(2); }} className="p-1 opacity-75 hover:opacity-100">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                {bleStatus === "scanning" && (
                  <div className="py-8 flex flex-col items-center text-center">
                    <div className="w-16 h-16 rounded-full apple-bluetooth-orb text-[#38bdf8] flex items-center justify-center mb-4">
                      <Icon name="radio" size={28} className="animate-pulse" />
                    </div>
                    <p className="text-sm font-bold">Listening for Bluetooth Signals...</p>
                    <p className="text-xs opacity-75 mt-1">Ensure your TrackoVex beacon is nearby</p>
                  </div>
                )}

                {bleStatus === "discovered" && discoveredESP && (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl apple-settings-card flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl apple-bluetooth-orb flex items-center justify-center text-[#38bdf8]">
                          <Icon name="cpu" size={20} />
                        </div>
                        <div>
                          <div className="text-sm font-bold">{discoveredESP.rawName}</div>
                          <div className="text-[11px] text-[#38bdf8] font-mono">Battery: {discoveredESP.battery}%</div>
                        </div>
                      </div>
                      <span className="text-xs font-mono font-bold text-[#38bdf8]">{discoveredESP.rssi}</span>
                    </div>

                    <button 
                      onClick={confirmPairDevice}
                      className="w-full py-3.5 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-xl active:scale-95 transition-all"
                    >
                      Connect & Begin Tracking
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ========================================================
              MODAL: RENAME DEVICE
              ======================================================== */}
          {isRenaming && (
            <div 
              onClick={(e) => { 
                e.stopPropagation(); 
                setIsRenaming(false); 
                setActiveDockTab(2);
              }}
              className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] apple-glass-panel p-7 shadow-2xl space-y-4 border ${isLight ? 'border-sky-300/40 text-slate-900' : 'border-white/30 text-white'}`}
              >
                <div className="text-center">
                  <h3 className="text-xl font-extrabold">Rename TrackoVex</h3>
                  <p className="text-xs opacity-75 mt-1">Customize beacon label</p>
                </div>

                <div>
                  <input 
                    type="text"
                    value={renameInput}
                    onChange={(e) => setRenameInput(e.target.value)}
                    placeholder="e.g. Camera, Keys, Wallet"
                    autoFocus
                    className="w-full px-4 py-3.5 rounded-2xl apple-glass-input text-base font-semibold focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button 
                    onClick={() => { setIsRenaming(false); setActiveDockTab(2); }}
                    className="py-3 rounded-2xl apple-glass-btn text-xs font-semibold"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={saveRename}
                    className="py-3 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-lg"
                  >
                    Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================
              DRAWER: MULTI-DEVICE SWITCHER
              ======================================================== */}
          {showDeviceDrawer && (
            <div 
              onClick={(e) => { 
                e.stopPropagation(); 
                setShowDeviceDrawer(false); 
                setActiveDockTab(2);
              }}
              className="fixed inset-0 z-50 flex items-end justify-center p-0 sm:p-6 bg-black/75 backdrop-blur-2xl transition-all duration-300"
            >
              <div 
                onClick={(e) => e.stopPropagation()}
                className={`w-full sm:max-w-md rounded-t-[36px] sm:rounded-[36px] apple-glass-panel p-6 shadow-2xl space-y-4 border ${isLight ? 'border-sky-300/40 text-slate-900' : 'border-white/30 text-white'}`}
              >
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h3 className="text-lg font-bold">Active TrackoVex Devices</h3>
                    <p className="text-xs opacity-75">Switch focus between connected beacons</p>
                  </div>
                  <button onClick={() => { setShowDeviceDrawer(false); setActiveDockTab(2); }} className="p-1 opacity-75 hover:opacity-100">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {devices.map(dev => {
                    const isActive = dev.id === currentDevice?.id;
                    return (
                      <div 
                        key={dev.id}
                        onClick={() => {
                          setActiveDeviceId(dev.id);
                          setShowDeviceDrawer(false);
                          setActiveDockTab(2);
                          notify(`Switched to ${dev.name}`);
                        }}
                        className={`p-3.5 rounded-2xl flex items-center justify-between cursor-pointer transition-all border ${
                          isActive 
                            ? 'bg-sky-400/20 border-[#38bdf8]' 
                            : 'bg-white/5 border-white/10 hover:bg-white/10'
                        }`}
                      >
                        <div className="flex items-center gap-3">
                          <div className={`w-9 h-9 rounded-xl flex items-center justify-center ${
                            isActive ? 'bg-[#38bdf8] text-black font-bold' : 'bg-white/10 opacity-80'
                          }`}>
                            <Icon name="radio" size={16} />
                          </div>
                          <div>
                            <div className="text-sm font-bold flex items-center gap-2">
                              <span>{dev.name}</span>
                              {isActive && <span className="w-1.5 h-1.5 rounded-full bg-[#38bdf8]"></span>}
                            </div>
                            <div className="text-[11px] text-[#38bdf8] font-mono">Battery: {dev.battery}%</div>
                          </div>
                        </div>

                        <span className={`text-xs font-semibold ${isActive ? 'text-[#38bdf8]' : 'opacity-60'}`}>
                          {isActive ? "Active" : "Select"}
                        </span>
                      </div>
                    );
                  })}
                </div>

                <button 
                  onClick={() => {
                    setShowDeviceDrawer(false);
                    startBLEScan();
                  }}
                  className="w-full py-3.5 rounded-2xl apple-primary-glass-btn text-white text-xs font-bold shadow-lg flex items-center justify-center gap-2"
                >
                  <Icon name="plus" size={16} />
                  <span>Pair Another TrackoVex</span>
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TrackoVexApp />);
  </script>
</body>
</html>
